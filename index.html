      <path d="M -10,-30 L 20,-30 L 20,-10 L 50,-30 L 20,-50 L 20,-30 L -10,-30" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 20,-30 L 50,-30 L 50,-10 L 80,-30 L 50,-50 L 50,-30 L 20,-30" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<style>
  /* ============================================================
     PREVISIO — landing styles
     Direct lift of /frontend/styles.css "LUXURY QUANT (GOLD & ONYX)"
     ============================================================ */
  :root {
    --bg-deep: #050505;
    --bg-soft: #0a0a0c;
    --bg-panel: rgba(20, 20, 23, 0.70);
    --bg-card: rgba(255, 255, 255, 0.025);

    --gold-primary: #D4AF37;
    --gold-light: #F3E5AB;
    --gold-dim: #8a7024;
    --gold-deep: #5e4b16;
    --gold-glow: rgba(212, 175, 55, 0.3);

    --text-main: #EAEAEA;
    --text-muted: #888888;
    --text-faint: #555;
    --text-gold: #D4AF37;

    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --border-gold: rgba(212, 175, 55, 0.25);

    --glass-blur: blur(20px);
    --shadow-luxury: 0 20px 50px rgba(0,0,0,0.7);

    --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;

    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 8px;

    --gain: #6ad28a;
    --loss: #e8a87c;
    --neutral: #7eb8da;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    line-height: 1.55;
  }

  /* Ambient bg pulled from product */
  .ambient-bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 12% 8%, rgba(212, 175, 55, 0.06), transparent 38%),
      radial-gradient(circle at 88% 18%, rgba(50, 60, 90, 0.10), transparent 40%),
      radial-gradient(circle at 50% 110%, rgba(212, 175, 55, 0.05), transparent 45%);
    z-index: -2;
    pointer-events: none;
  }
  .ambient-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 64px 64px;
    z-index: -1;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);
  }

  /* ---------- GLOBAL LOOP BACKGROUND ---------- */
  .global-video-bg {
    position: fixed;
    inset: 0;
    z-index: -3;
    overflow: hidden;
    pointer-events: none;
    background: #050505;
  }
  .global-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 62% center;
    opacity: 0.58;
    filter: saturate(1.15) contrast(1.08);
    display: block;
  }
  .global-video-overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(5,5,5,0.20) 0%, rgba(5,5,5,0.08) 42%, rgba(5,5,5,0.34) 100%),
      radial-gradient(ellipse at 50% 0%, transparent 58%, rgba(5,5,5,0.22) 100%);
  }


  /* ---------- typography helpers ---------- */
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--gold-primary);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before {
    content: '';
    width: 22px;
    height: 1px;
    background: var(--gold-dim);
  }
  .eyebrow.no-rule::before { display: none; }

  .display {
    font-family: var(--font-ui);
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1.04;
    color: var(--text-main);
    text-wrap: balance;
  }
  .display .accent { color: var(--gold-primary); font-weight: 400; }
  .display em { font-style: italic; font-weight: 200; color: var(--gold-light); }

  .lede {
    color: var(--text-muted);
    font-size: 17px;
    font-weight: 300;
    line-height: 1.6;
    text-wrap: pretty;
    max-width: 56ch;
  }

  .mono { font-family: var(--font-mono); }

  /* ---------- layout ---------- */
  .container {
    width: min(1280px, 100% - 48px);
    margin: 0 auto;
  }
  section {
    position: relative;
    padding: clamp(80px, 9vw, 140px) 0;
  }
  section + section { border-top: 1px solid var(--border-subtle); }

  .section-head { display: grid; gap: 14px; margin-bottom: 56px; max-width: 780px; }

  /* ---------- nav ---------- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 80;
    background: rgba(5,5,5,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
  }
  .brand-logo {
    height: 48px;
    width: auto;
    max-width: 280px;
    display: block;
  }
  @media (max-width: 640px) {
    .brand-logo {
      height: 36px;
    }
  }

  .nav-logo {
    height: 36px;
    width: auto;
    display: block;
    filter: drop-shadow(0 0 8px rgba(212,175,55,0.25));
    transition: filter 0.3s ease, transform 0.3s cubic-bezier(.16,1,.3,1);
    animation: navLogoIn 0.8s cubic-bezier(0.22,1,0.36,1) 0.2s both,
               navLogoFloat 4s ease-in-out 1.2s infinite;
  }
  @keyframes navLogoIn {
    from { opacity: 0; transform: translateX(-20px) scale(0.85); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes navLogoFloat {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(212,175,55,0.25)); }
    50%      { filter: drop-shadow(0 0 16px rgba(212,175,55,0.45)); }
  }
  .brand:hover .nav-logo {
    filter: drop-shadow(0 0 18px rgba(212,175,55,0.7));
    transform: translateX(4px) scale(1.05);
  }
  @media (max-width: 640px) {
    .nav-logo { height: 28px; }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
  }
  .brand-mark {
    width: 28px; height: 28px;
    border: 1px solid var(--gold-dim);
    border-radius: 6px;
    display: grid; place-items: center;
    color: var(--gold-primary);
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13px;
    box-shadow: inset 0 0 12px rgba(212,175,55,0.12);
  }
  .brand-name {
    font-weight: 700;
    letter-spacing: 0.16em;
    font-size: 13px;
  }
  .brand-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold-primary);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 2px;
    opacity: 0.7;
  }

  /* Logo section */
  .logo-section {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    transition: opacity 0.2s ease;
  }
  .logo-section:hover {
    opacity: 0.8;
  }
  .logo-mark {
    font-size: 24px;
    color: var(--gold-primary);
    font-weight: 700;
  }
  .logo-text {
    font-weight: 700;
    letter-spacing: 0.16em;
    font-size: 13px;
  }
  .logo-tag {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--gold-primary);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  /* Performance section */
  .performance-section {
    padding: clamp(80px, 9vw, 140px) 0;
    border-top: 1px solid var(--border-subtle);
  }
  .performance-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
    margin-top: 48px;
  }
  .perf-card {
    padding: 24px;
    background: rgba(212, 175, 55, 0.05);
    border: 1px solid rgba(212, 175, 55, 0.15);
    border-radius: 8px;
    transition: all 0.2s ease;
  }
  .perf-card:hover {
    background: rgba(212, 175, 55, 0.08);
    border-color: rgba(212, 175, 55, 0.25);
  }
  .perf-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  .perf-value {
    font-size: 28px;
    font-weight: 600;
    color: var(--gold-light);
    letter-spacing: -0.01em;
  }
  .perf-note {
    margin-top: 32px;
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
    max-width: 780px;
  }

  /* Dashboard models comparison */
  .dashboard-models {
    margin-top: 16px;
    border: 1px solid rgba(212, 175, 55, 0.1);
    border-radius: 8px;
    overflow: hidden;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
  }
  .lang-selector {
    display: flex;
    gap: 6px;
    border-right: 1px solid rgba(212, 175, 55, 0.2);
    padding-right: 16px;
  }

  .lang-btn {
    background: transparent;
    border: 1px solid rgba(212, 175, 55, 0.3);
    color: var(--text-secondary);
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s ease;
  }

  .lang-btn:hover {
    border-color: var(--gold-primary);
    color: var(--gold-primary);
  }

  .lang-btn.active {
    background: var(--gold-primary);
    border-color: var(--gold-primary);
    color: var(--bg-deep);
  }

  @media (max-width: 768px) {
    .lang-selector {
      border-right: none;
      padding-right: 0;
    }
  }

  .nav-link {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.04em;
    transition: color 0.2s ease;
  }
  .nav-link:hover { color: var(--text-main); }
  .nav-cta {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* ---------- buttons (from product) ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: var(--radius-sm);
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.25s ease;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .btn-gold {
    background: linear-gradient(135deg, var(--gold-dim), var(--gold-deep));
    border-color: var(--gold-primary);
    color: #fff;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .btn-gold:hover {
    filter: brightness(1.15);
    transform: translateY(-1px);
    box-shadow: 0 8px 28px rgba(212,175,55,0.22), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-main);
  }
  .btn-ghost:hover {
    border-color: var(--gold-primary);
    color: var(--gold-primary);
  }
  .btn-lg { padding: 16px 28px; font-size: 13px; }
  .btn .arrow { transition: transform 0.2s ease; }
  .btn:hover .arrow { transform: translateX(3px); }

  /* ---------- glass surfaces ---------- */
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-luxury);
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
  }
  .card:hover {
    border-color: var(--border-gold);
    background: rgba(212,175,55,0.025);
  }

  /* ---------- intro splash — fracture dissolve ---------- */
  .splash-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #050505;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .splash-bg-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.18;
    pointer-events: none;
  }
  .splash-overlay {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(212,175,55,0.04), transparent 60%),
      radial-gradient(ellipse at 50% 50%, rgba(5,5,5,0.3), transparent 80%);
    pointer-events: none;
  }
  .splash-content {
    position: relative;
    z-index: 2;
    text-align: center;
  }
  .splash-particles {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }

  /* Splash logo + title row */
  .splash-title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 2.5vw, 36px);
  }
  .splash-logo {
    height: clamp(48px, 7vw, 88px);
    width: auto;
    object-fit: contain;
    opacity: 0;
    animation:
      splashLogoIn 1.1s cubic-bezier(0.22,1,0.36,1) 0.15s forwards,
      splashLogoPulse 2.8s ease-in-out 1.5s infinite,
      splashLogoForward 2.4s cubic-bezier(0.45,0,0.55,1) 1.5s infinite;
    filter: drop-shadow(0 0 18px rgba(212,175,55,0.35));
    transform-origin: center;
  }
  @keyframes splashLogoIn {
    0%   { opacity: 0; transform: translateX(-60px) scale(0.7) rotate(-8deg); filter: blur(6px) drop-shadow(0 0 0 rgba(212,175,55,0)); }
    60%  { opacity: 1; transform: translateX(6px) scale(1.08) rotate(2deg); filter: blur(0) drop-shadow(0 0 28px rgba(212,175,55,0.55)); }
    100% { opacity: 1; transform: translateX(0) scale(1) rotate(0); filter: blur(0) drop-shadow(0 0 18px rgba(212,175,55,0.35)); }
  }
  @keyframes splashLogoPulse {
    0%, 100% { filter: drop-shadow(0 0 18px rgba(212,175,55,0.35)) brightness(1); }
    50%      { filter: drop-shadow(0 0 32px rgba(212,175,55,0.65)) brightness(1.18); }
  }
  @keyframes splashLogoForward {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(6px); }
  }

  /* Title */
  .splash-title {
    font-family: var(--font-ui);
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 300;
    letter-spacing: 0.28em;
    color: var(--gold-primary);
    text-shadow: 0 0 40px rgba(212,175,55,0.2);
    opacity: 0;
    animation: splashTitleIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes splashTitleIn {
    0%   { opacity: 0; transform: translateY(16px) scale(0.96); filter: blur(6px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  /* Subtitle */
  .splash-sub {
    font-family: var(--font-mono);
    font-size: clamp(12px, 1.8vw, 16px);
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 18px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s cubic-bezier(0.22,1,0.36,1), transform 0.6s cubic-bezier(0.22,1,0.36,1);
  }
  .splash-sub.visible {
    opacity: 0.7;
    transform: translateY(0);
  }

  /* Fracture: individual letters */
  .splash-letter {
    display: inline-block;
    transition: none;
  }
  .fracturing .splash-letter {
    animation: letterFracture 1.6s cubic-bezier(0.4, 0, 0.2, 1) var(--delay, 0s) forwards;
  }
  @keyframes letterFracture {
    0% {
      opacity: 1;
      transform: translate(0, 0) rotate(0deg);
      filter: blur(0);
      text-shadow: 0 0 0 rgba(212,175,55,0);
    }
    30% {
      text-shadow: 0 0 16px rgba(212,175,55,0.5);
    }
    100% {
      opacity: 0;
      transform: translate(var(--dx, 0), var(--dy, 0)) rotate(var(--dr, 0));
      filter: blur(5px);
      text-shadow: 0 0 24px rgba(212,175,55,0.3);
    }
  }

  /* Gold particles */
  .splash-particle {
    position: absolute;
    left: var(--px, 50%);
    top: var(--py, 50%);
    width: var(--psize, 3px);
    height: var(--psize, 3px);
    background: var(--gold-primary);
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
  }
  .fracturing .splash-particle {
    animation: particleDrift 1.5s cubic-bezier(0.4, 0, 0.2, 1) var(--pdelay, 0s) forwards;
  }
  @keyframes particleDrift {
    0% {
      opacity: 0;
      transform: translate(0, 0) scale(1);
    }
    15% {
      opacity: 0.8;
    }
    100% {
      opacity: 0;
      transform: translate(var(--pdx, 0), var(--pdy, 0)) scale(0.3);
    }
  }

  /* Fade out entire splash */
  .splash-screen.fading-out {
    animation: splashFadeOut 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes splashFadeOut {
    0%   { opacity: 1; }
    100% { opacity: 0; pointer-events: none; }
  }

  /* Logo exit animation when text fractures */
  .fracturing .splash-logo {
    animation: splashLogoOut 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
  }
  @keyframes splashLogoOut {
    0% {
      opacity: 1;
      transform: translateX(0) scale(1) rotate(0);
      filter: drop-shadow(0 0 18px rgba(212,175,55,0.35)) blur(0);
    }
    30% {
      opacity: 1;
      transform: translateX(8px) scale(1.15) rotate(3deg);
      filter: drop-shadow(0 0 36px rgba(212,175,55,0.8)) blur(0);
    }
    100% {
      opacity: 0;
      transform: translateX(80px) scale(0.6) rotate(15deg);
      filter: drop-shadow(0 0 60px rgba(212,175,55,0.4)) blur(6px);
    }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .splash-screen { display: none; }
  }

  /* ---------- reveal animations (Framer-Motion-ready spec) ---------- */
  .reveal {
    opacity: 0;
    transition-property: opacity, transform;
    transition-duration: 0.72s;
    transition-timing-function: cubic-bezier(.16, 1, .3, 1);
    will-change: opacity, transform;
  }
  /* variant: up (default) */
  .rv-up { transform: translateY(28px); }
  .rv-up.in { opacity: 1; transform: translateY(0); }
  /* variant: left */
  .rv-left { transform: translateX(-32px); }
  .rv-left.in { opacity: 1; transform: translateX(0); }
  /* variant: right */
  .rv-right { transform: translateX(32px); }
  .rv-right.in { opacity: 1; transform: translateX(0); }
  /* variant: scale */
  .rv-scale { transform: scale(0.94); }
  .rv-scale.in { opacity: 1; transform: scale(1); }
  /* variant: fade */
  .rv-fade { transform: none; }
  .rv-fade.in { opacity: 1; }

  /* stagger delays — 0.07s per step, premium pacing */
  .reveal[data-delay="1"] { transition-delay: 0.07s; }
  .reveal[data-delay="2"] { transition-delay: 0.14s; }
  .reveal[data-delay="3"] { transition-delay: 0.21s; }
  .reveal[data-delay="4"] { transition-delay: 0.28s; }
  .reveal[data-delay="5"] { transition-delay: 0.35s; }
  .reveal[data-delay="6"] { transition-delay: 0.42s; }
  .reveal[data-delay="7"] { transition-delay: 0.49s; }
  .reveal[data-delay="8"] { transition-delay: 0.56s; }
  .reveal[data-delay="9"] { transition-delay: 0.63s; }

  /* ---------- nav entrance ---------- */
  @keyframes navSlideIn {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .nav {
    animation: navSlideIn 0.6s cubic-bezier(.16,1,.3,1) 0.1s both;
  }

  /* ---------- card hover (premium lift) ---------- */
  .card {
    transition: border-color 0.3s ease, transform 0.35s cubic-bezier(.16,1,.3,1),
                background 0.3s ease, box-shadow 0.35s ease;
  }
  .card:hover {
    border-color: var(--border-gold);
    background: rgba(212,175,55,0.025);
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.35), 0 0 0 1px rgba(212,175,55,0.08);
  }

  /* ---------- pricing card hover ---------- */
  .price-card {
    transition: border-color 0.3s ease, transform 0.4s cubic-bezier(.16,1,.3,1),
                background 0.3s ease, box-shadow 0.4s ease;
  }
  .price-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,175,55,0.12);
  }
  .price-card.featured:hover {
    box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(212,175,55,0.08);
  }

  /* ---------- btn hover ripple ---------- */
  .btn {
    position: relative;
    overflow: hidden;
    transition: all 0.28s cubic-bezier(.16,1,.3,1);
  }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.12), transparent 60%);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .btn:hover::after { opacity: 1; }

  /* ---------- FAQ smooth accordion ---------- */
  .faq-a {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.4s cubic-bezier(.16,1,.3,1);
    overflow: hidden;
  }
  .faq-item.open .faq-a { grid-template-rows: 1fr; }
  .faq-a-inner {
    overflow: hidden;
    padding: 0 24px;
    transition: padding 0.3s ease;
  }
  .faq-item.open .faq-a-inner { padding: 0 24px 22px; }
  .faq-q .toggle {
    transition: transform 0.35s cubic-bezier(.16,1,.3,1), border-color 0.25s ease;
  }
  .faq-item.open .faq-q .toggle {
    transform: rotate(45deg);
    border-color: var(--gold-dim);
  }

  /* ---------- mobile menu ---------- */
  .mobile-menu {
    display: none;
    position: fixed;
    inset: 64px 0 0;
    background: rgba(5,5,5,0.96);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    z-index: 79;
    padding: 0 24px;
    overflow-y: auto;
    transform: translateY(-8px);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.35s cubic-bezier(.16,1,.3,1), opacity 0.28s ease;
  }
  .mobile-menu.open {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
    padding-top: 32px;
  }
  .mobile-menu a {
    display: block;
    padding: 16px 0;
    border-bottom: 1px solid var(--border-subtle);
    color: var(--text-main);
    font-size: 16px;
    text-decoration: none;
    transform: translateX(-12px);
    opacity: 0;
    transition: transform 0.35s cubic-bezier(.16,1,.3,1), opacity 0.3s ease, color 0.2s ease;
  }
  .mobile-menu.open a {
    transform: translateX(0);
    opacity: 1;
  }
  /* stagger mobile menu links */
  .mobile-menu a:nth-child(1) { transition-delay: 0.04s; }
  .mobile-menu a:nth-child(2) { transition-delay: 0.08s; }
  .mobile-menu a:nth-child(3) { transition-delay: 0.12s; }
  .mobile-menu a:nth-child(4) { transition-delay: 0.16s; }
  .mobile-menu a:nth-child(5) { transition-delay: 0.20s; }
  .mobile-menu a:nth-child(6) { transition-delay: 0.24s; }
  .mobile-menu a:nth-child(7) { transition-delay: 0.28s; }
  .mobile-menu a:nth-child(8) { transition-delay: 0.32s; }
  @media (max-width: 820px) {
    .nav-links { display: none; }
    .nav-cta .btn-ghost { display: none; }
    .menu-btn { display: inline-flex; }
    .mobile-menu { display: block; }
  }

  /* ---------- stage card hover slide ---------- */
  .stage {
    transition: all 0.3s cubic-bezier(.16,1,.3,1);
  }
  .stage:hover {
    border-color: var(--border-gold);
    transform: translateX(6px);
    background: rgba(212,175,55,0.02);
  }

  /* ---------- feature icon pulse on card hover ---------- */
  .feature:hover .feature-icon {
    box-shadow: 0 0 20px rgba(212,175,55,0.15);
    border-color: var(--gold-primary);
    transition: all 0.35s ease;
  }

  /* ---------- dashboard preview entrance ---------- */
  .desk {
    transition: box-shadow 0.5s ease;
  }
  .desk:hover {
    box-shadow: 0 28px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(212,175,55,0.06);
  }

  /* ---------- trust audit line hover ---------- */
  .audit-line {
    transition: background 0.2s ease, padding-left 0.2s ease;
    border-radius: 4px;
    padding-left: 4px;
  }
  .audit-line:hover {
    background: rgba(212,175,55,0.04);
    padding-left: 8px;
  }

  /* ---------- CTA panel glow pulse ---------- */
  @keyframes ctaGlow {
    0%, 100% { box-shadow: 0 0 60px rgba(212,175,55,0.06), inset 0 0 60px rgba(212,175,55,0.02); }
    50%      { box-shadow: 0 0 80px rgba(212,175,55,0.12), inset 0 0 80px rgba(212,175,55,0.04); }
  }
  .cta-panel {
    animation: ctaGlow 4s ease-in-out infinite;
  }

  /* ---------- method card math hover ---------- */
  .method-card:hover .method-math {
    border-color: var(--border-gold);
    background: rgba(0,0,0,0.55);
    transition: all 0.3s ease;
  }

  /* ---------- defaults grid item hover ---------- */
  .md-default {
    transition: all 0.25s ease;
  }
  .md-default:hover {
    border-color: var(--border-gold);
    background: rgba(212,175,55,0.04);
    transform: translateY(-1px);
  }

  /* ---------- HERO ---------- */
  .hero {
    padding-top: clamp(60px, 7vw, 110px);
    padding-bottom: clamp(60px, 7vw, 110px);
    position: relative;
    overflow: hidden;
  }

  /* Hero video background layer */
  .hero-video-wrap {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    /* Static gradient fallback if video fails */
    background:
      radial-gradient(ellipse at 30% 20%, rgba(212,175,55,0.06), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(50,60,90,0.08), transparent 50%),
      linear-gradient(180deg, rgba(5,5,5,0.0) 0%, rgba(5,5,5,0.0) 100%);
  }
  .hero-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.22;
    pointer-events: none;
    display: block;
  }
  /* Dark overlay above video for text readability */
  .hero-video-overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(5,5,5,0.55) 0%, rgba(5,5,5,0.35) 40%, rgba(5,5,5,0.65) 100%),
      radial-gradient(ellipse at 50% 0%, transparent 40%, rgba(5,5,5,0.5) 100%);
    pointer-events: none;
  }
  /* Hero content above video */
  .hero > .container {
    position: relative;
    z-index: 2;
  }

  /* Reduced motion: hide video entirely */
  @media (prefers-reduced-motion: reduce) {
    .hero-video,
    .global-video { display: none; }
  }
  /* Mobile: lower opacity for perf, smaller decode */
  @media (max-width: 768px) {
    .hero-video { opacity: 0.38; }
    .global-video { opacity: 0.42; object-position: 58% center; }
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 64px;
    align-items: center;
  }
  @media (max-width: 1024px) {
    .hero-grid { grid-template-columns: 1fr; gap: 48px; }
  }
  .hero h1 {
    font-size: clamp(40px, 5.4vw, 76px);
    margin: 18px 0 28px;
  }
  .hero-actions {
    display: flex;
    gap: 14px;
    margin-top: 32px;
    flex-wrap: wrap;
  }
  .hero-meta {
    display: flex;
    gap: 36px;
    margin-top: 48px;
    padding-top: 28px;
    border-top: 1px solid var(--border-subtle);
    flex-wrap: wrap;
  }
  .hero-stat .num {
    font-family: var(--font-ui);
    font-weight: 400;
    font-size: 26px;
    color: var(--text-main);
    letter-spacing: -0.01em;
  }
  .hero-stat .num .unit { color: var(--gold-primary); font-size: 16px; font-weight: 400; margin-left: 2px; }
  .hero-stat .lab {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Forecast chart preview (right side of hero) */
  .forecast-panel {
    padding: 22px;
    position: relative;
  }
  .fp-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 18px;
  }
  .fp-title { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; }
  .fp-sub  { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.16em; text-transform: uppercase; margin-top: 4px; }
  .fp-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 4px 10px;
    border: 1px solid var(--gold-dim);
    color: var(--gold-primary);
    border-radius: 4px;
    letter-spacing: 0.14em;
  }
  .fp-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .fp-kpi { border: 1px solid var(--border-subtle); border-radius: 8px; padding: 10px 12px; background: rgba(0,0,0,0.25); }
  .fp-kpi .l { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); letter-spacing: 0.18em; text-transform: uppercase; }
  .fp-kpi .v { font-size: 16px; font-weight: 500; margin-top: 4px; }
  .fp-kpi.gold .v { color: var(--gold-primary); }

  /* Model chip row */
  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .chip {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 4px 9px;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
  }
  .chip.active { color: var(--gold-primary); border-color: var(--border-gold); background: rgba(212,175,55,0.05); }

  /* ---------- model pipeline ---------- */
  .pipeline {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 64px;
    align-items: flex-start;
  }
  @media (max-width: 1024px) { .pipeline { grid-template-columns: 1fr; gap: 36px; } }

  .model-table {
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .model-row {
    display: grid;
    grid-template-columns: 28px 130px 1fr 170px;
    gap: 14px;
    padding: 14px 18px;
    align-items: center;
    border-bottom: 1px solid var(--border-subtle);
    font-size: 13px;
    transition: background 0.2s ease;
  }
  .model-row:hover { background: rgba(212,175,55,0.04); }
  .model-row:last-child { border-bottom: none; }
  .model-row.head {
    background: rgba(255,255,255,0.02);
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold-primary);
    text-transform: uppercase;
    letter-spacing: 0.18em;
  }
  .model-row.head:hover { background: rgba(255,255,255,0.02); }
  .model-row .num { font-family: var(--font-mono); color: var(--text-faint); font-size: 11px; }
  .model-row .name { font-weight: 600; letter-spacing: 0.04em; }
  .model-row .type {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .model-row .wbar {
    height: 6px;
    background: rgba(255,255,255,0.04);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .model-row .wbar > span {
    position: absolute; inset: 0 auto 0 0;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold-primary));
    transform-origin: left;
    transform: scaleX(0);
    transition: transform 1.2s cubic-bezier(.2,.7,.2,1);
  }
  .model-row.in .wbar > span { transform: scaleX(var(--w, 0.5)); }
  .model-row .wnum {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--gold-primary);
    min-width: 44px;
    text-align: right;
  }

  /* pipeline stages */
  .stages { display: grid; gap: 12px; }
  .stage {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 16px;
    align-items: center;
    padding: 14px 18px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    background: var(--bg-card);
    transition: all 0.25s ease;
  }
  .stage:hover { border-color: var(--border-gold); transform: translateX(4px); }
  .stage-num {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--gold-primary);
    letter-spacing: 0.1em;
    width: 36px; height: 36px;
    border: 1px solid var(--border-gold);
    border-radius: 6px;
    display: grid; place-items: center;
  }
  .stage-name { font-weight: 500; font-size: 14px; letter-spacing: 0.02em; }
  .stage-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .stage-tick { color: var(--gold-dim); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; }

  /* ---------- feature grid ---------- */
  .features-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  @media (max-width: 980px) { .features-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .features-grid { grid-template-columns: 1fr; } }
  .feature {
    padding: 26px;
    position: relative;
    overflow: hidden;
  }
  .feature-icon {
    width: 40px; height: 40px;
    border: 1px solid var(--border-gold);
    border-radius: 8px;
    display: grid; place-items: center;
    margin-bottom: 22px;
    color: var(--gold-primary);
    background: rgba(212,175,55,0.04);
  }
  .feature h3 {
    font-size: 17px;
    font-weight: 500;
    margin: 0 0 10px;
    letter-spacing: 0.01em;
  }
  .feature p {
    font-size: 13.5px;
    color: var(--text-muted);
    margin: 0;
    line-height: 1.6;
  }
  .feature-tag {
    position: absolute;
    top: 22px; right: 22px;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-faint);
    letter-spacing: 0.18em;
  }

  /* ---------- analytics deep-dive ---------- */
  .analytics-grid {
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 48px;
    align-items: center;
  }
  @media (max-width: 1024px) { .analytics-grid { grid-template-columns: 1fr; gap: 32px; } }
  .ana-points { display: grid; gap: 22px; margin-top: 36px; }
  .ana-point { display: grid; grid-template-columns: 28px 1fr; gap: 14px; }
  .ana-point .dot {
    width: 8px; height: 8px;
    background: var(--gold-primary);
    border-radius: 2px;
    margin-top: 8px;
    box-shadow: 0 0 12px var(--gold-glow);
  }
  .ana-point h4 { font-size: 14px; font-weight: 600; margin: 0 0 4px; letter-spacing: 0.04em; }
  .ana-point p { font-size: 13px; color: var(--text-muted); margin: 0; }

  /* big chart svg styling */
  .big-chart {
    padding: 24px;
    position: relative;
  }
  .big-chart .gridline { stroke: rgba(255,255,255,0.05); stroke-width: 1; }
  .big-chart .axis { stroke: rgba(255,255,255,0.1); stroke-width: 1; }
  .big-chart .axis-text { fill: var(--text-faint); font-family: var(--font-mono); font-size: 10px; }
  .big-chart .pi-band { fill: rgba(212,175,55,0.08); stroke: none; }
  .big-chart .pi-edge { stroke: var(--gold-dim); stroke-width: 1; stroke-dasharray: 3 3; fill: none; opacity: 0.6; }
  .big-chart .price-line { stroke: rgba(234,234,234,0.9); stroke-width: 1.5; fill: none; }
  .big-chart .forecast-line { stroke: var(--gold-primary); stroke-width: 2; fill: none; filter: drop-shadow(0 0 6px var(--gold-glow)); }
  .big-chart .model-line { stroke: rgba(126,184,218,0.55); stroke-width: 1; fill: none; }
  .big-chart .cut { stroke: rgba(212,175,55,0.4); stroke-width: 1; stroke-dasharray: 4 4; }

  .big-chart-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .big-chart-tab {
    display: flex;
    gap: 4px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 3px;
  }
  .big-chart-tab button {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 6px 12px;
    letter-spacing: 0.12em;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .big-chart-tab button.on {
    background: rgba(212,175,55,0.12);
    color: var(--gold-primary);
  }

  .legend { display: flex; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .legend-swatch { width: 18px; height: 2px; }

  /* ---------- methodology ---------- */
  .method-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 36px;
  }
  @media (max-width: 1100px) { .method-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .method-grid { grid-template-columns: 1fr; } }
  .method-card {
    padding: 22px;
    display: grid;
    gap: 14px;
    align-content: start;
    min-height: 240px;
  }
  .method-head { display: grid; gap: 8px; }
  .method-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold-primary);
    letter-spacing: 0.22em;
  }
  .method-card h3 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  .method-math {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--gold-light);
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 10px 12px;
    letter-spacing: 0.02em;
    word-break: break-word;
    line-height: 1.6;
  }
  .method-body { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.6; }

  .method-download {
    margin: 40px 0 48px;
  }
  .md-inner {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 20px;
    padding: 22px 28px;
    border: 1px solid var(--border-gold);
    border-radius: var(--radius-md);
    background:
      radial-gradient(circle at 0% 50%, rgba(212,175,55,0.08), transparent 50%),
      var(--bg-panel);
  }
  @media (max-width: 720px) {
    .md-inner { grid-template-columns: 1fr; text-align: left; }
    .md-inner .btn { width: 100%; }
  }
  .md-icon {
    width: 56px; height: 56px;
    border: 1px solid var(--border-gold);
    border-radius: 10px;
    display: grid; place-items: center;
    color: var(--gold-primary);
    font-size: 28px;
    background: rgba(212,175,55,0.05);
  }
  .md-title { font-size: 16px; font-weight: 600; letter-spacing: 0.01em; }
  .md-sub { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing: 0.08em; margin-top: 6px; }

  .method-defaults {
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    background: var(--bg-card);
    padding: 28px;
  }
  .md-defaults-head { margin-bottom: 18px; }
  .md-defaults-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  @media (max-width: 980px) { .md-defaults-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .md-defaults-grid { grid-template-columns: 1fr; } }
  .md-default {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    gap: 12px;
  }
  .md-key {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }
  .md-val {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--gold-primary);
    font-weight: 500;
    text-align: right;
  }

  /* ---------- use cases ---------- */
  .use-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
  @media (max-width: 880px) { .use-grid { grid-template-columns: 1fr; } }
  .use-card {
    padding: 32px;
    display: grid;
    gap: 18px;
    min-height: 320px;
    align-content: start;
    position: relative;
  }
  .use-card .role {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold-primary);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .use-card h3 { font-size: 22px; font-weight: 400; margin: 0; letter-spacing: -0.005em; }
  .use-card p { font-size: 14px; color: var(--text-muted); margin: 0; line-height: 1.65; }
  .use-card ul {
    list-style: none;
    padding: 0;
    margin: 8px 0 0;
    display: grid;
    gap: 8px;
  }
  .use-card li {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-main);
    letter-spacing: 0.06em;
    padding-left: 16px;
    position: relative;
  }
  .use-card li::before {
    content: '›';
    position: absolute;
    left: 0;
    color: var(--gold-primary);
  }

  /* ---------- dashboard preview ---------- */
  .desk {
    display: grid;
    grid-template-columns: 360px 1fr 320px;
    gap: 16px;
    padding: 16px;
    background: rgba(5,5,5,0.5);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-luxury);
  }
  @media (max-width: 1100px) {
    .desk { grid-template-columns: 1fr; }
  }
  .desk .panel {
    background: var(--bg-panel);
    border-radius: var(--radius-md);
    padding: 18px;
    box-shadow: none;
  }
  .desk-panel-head { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 14px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 16px; }
  .desk-title { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .desk-sub { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); letter-spacing: 0.16em; text-transform: uppercase; margin-top: 4px; }

  .desk-field { margin-bottom: 14px; }
  .desk-field label { font-family: var(--font-mono); font-size: 9px; color: var(--gold-light); letter-spacing: 0.16em; text-transform: uppercase; }
  .desk-input {
    width: 100%;
    margin-top: 6px;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 9px 12px;
    color: var(--text-main);
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .desk-input.focus { border-color: var(--gold-dim); box-shadow: 0 0 12px rgba(212,175,55,0.12); }
  .desk-group-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--gold-light);
    letter-spacing: 0.18em;
    margin: 16px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-gold);
    text-transform: uppercase;
  }
  .desk-tabs { display: flex; gap: 4px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 3px; margin-bottom: 14px; }
  .desk-tabs button { flex: 1; background: transparent; border: none; color: var(--text-muted); font-family: var(--font-mono); font-size: 10px; padding: 8px; letter-spacing: 0.12em; cursor: pointer; border-radius: 4px; }
  .desk-tabs button.on { background: rgba(212,175,55,0.12); color: var(--gold-primary); }

  .kpi-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 10px; }
  .kpi-card {
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 14px;
    background: rgba(0,0,0,0.2);
  }
  .kpi-card.primary {
    border-color: var(--border-gold);
    background: linear-gradient(135deg, rgba(212,175,55,0.06), rgba(0,0,0,0.2));
  }
  .kpi-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); letter-spacing: 0.16em; text-transform: uppercase; }
  .kpi-value { font-size: 22px; font-weight: 400; margin-top: 6px; letter-spacing: -0.01em; }
  .kpi-card.primary .kpi-value { color: var(--gold-primary); font-size: 26px; }
  .kpi-meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 4px; }

  /* ---------- pricing ---------- */
  .price-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  @media (max-width: 980px) { .price-grid { grid-template-columns: 1fr; } }
  .price-card {
    padding: 32px 28px;
    display: grid;
    gap: 18px;
    align-content: start;
  }
  .price-card.featured {
    border-color: var(--border-gold);
    background: linear-gradient(180deg, rgba(212,175,55,0.06), rgba(255,255,255,0.02));
    position: relative;
  }
  .price-card.featured::before {
    content: 'RECOMMENDED';
    position: absolute;
    top: -10px; left: 28px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.22em;
    padding: 4px 10px;
    background: var(--gold-primary);
    color: #0a0a0c;
    border-radius: 4px;
  }
  .price-card .tier {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--gold-primary);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .price-card h3 { font-size: 28px; font-weight: 300; margin: 0; letter-spacing: -0.01em; }
  .price-card .price {
    font-size: 36px;
    font-weight: 300;
    letter-spacing: -0.02em;
  }
  .price-card .price .per { color: var(--text-muted); font-size: 13px; font-family: var(--font-mono); margin-left: 4px; }
  .price-card .desc { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.6; }
  .price-card ul { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
  .price-card li {
    font-size: 13px;
    color: var(--text-main);
    padding-left: 22px;
    position: relative;
    line-height: 1.55;
  }
  .price-card li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: var(--gold-primary);
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .price-card .btn { margin-top: 12px; width: 100%; }

  /* ---------- trust ---------- */
  .trust-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 64px;
    align-items: center;
  }
  @media (max-width: 980px) { .trust-grid { grid-template-columns: 1fr; gap: 32px; } }
  .trust-list { display: grid; gap: 18px; margin-top: 32px; }
  .trust-item { display: grid; grid-template-columns: 44px 1fr; gap: 16px; align-items: start; }
  .trust-icon {
    width: 44px; height: 44px;
    border: 1px solid var(--border-gold);
    border-radius: 8px;
    display: grid; place-items: center;
    color: var(--gold-primary);
    background: rgba(212,175,55,0.04);
  }
  .trust-item h4 { font-size: 14px; font-weight: 600; margin: 6px 0 4px; letter-spacing: 0.03em; }
  .trust-item p { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.6; }
  .trust-cert {
    padding: 28px;
    display: grid;
    gap: 18px;
  }
  .audit-line {
    display: grid;
    grid-template-columns: 16px 1fr auto;
    gap: 10px;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.06);
  }
  .audit-line:last-child { border-bottom: none; }
  .audit-line .ck { color: var(--gold-primary); }
  .audit-line .lab { color: var(--text-main); letter-spacing: 0.06em; }
  .audit-line .val { color: var(--text-muted); }

  /* ---------- FAQ ---------- */
  .faq { display: grid; gap: 8px; max-width: 920px; margin: 0 auto; }
  .faq-item {
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    background: var(--bg-card);
    overflow: hidden;
  }
  .faq-q {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 24px;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s ease;
    gap: 24px;
  }
  .faq-q:hover { background: rgba(212,175,55,0.03); }
  .faq-q h4 { font-size: 15px; font-weight: 500; margin: 0; letter-spacing: 0.01em; }
  .faq-q .toggle {
    width: 24px; height: 24px;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    display: grid; place-items: center;
    color: var(--gold-primary);
    font-family: var(--font-mono);
    font-size: 14px;
    transition: transform 0.3s ease;
    flex-shrink: 0;
  }
  .faq-item.open .faq-q .toggle { transform: rotate(45deg); }
  .faq-a {
    /* animation handled by grid-template-rows above */
  }
  .faq-item.open .faq-a { /* handled above */ }
  .faq-a-inner {
    /* handled above */
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.7;
  }

  /* ---------- final CTA ---------- */
  .cta-panel {
    padding: 80px 64px;
    text-align: center;
    background:
      radial-gradient(circle at 50% 20%, rgba(212,175,55,0.10), transparent 60%),
      var(--bg-panel);
    border: 1px solid var(--border-gold);
  }
  .cta-panel h2 { margin: 14px 0 18px; font-size: clamp(32px, 4vw, 52px); }
  .cta-panel .lede { margin: 0 auto; }
  .cta-actions { display: inline-flex; gap: 14px; margin-top: 36px; flex-wrap: wrap; justify-content: center; }

  /* ---------- footer ---------- */
  .footer {
    padding: 64px 0 40px;
    border-top: 1px solid var(--border-subtle);
  }
  .footer-grid {
    display: grid;
    grid-template-columns: 1.4fr repeat(4, 1fr);
    gap: 36px;
    margin-bottom: 48px;
  }
  @media (max-width: 880px) { .footer-grid { grid-template-columns: 1fr 1fr; gap: 32px; } }
  .footer-col h5 {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold-primary);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin: 0 0 16px;
  }
  .footer-col a {
    display: block;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 10px;
    transition: color 0.2s;
  }
  .footer-col a:hover { color: var(--text-main); }
  .footer-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 24px;
    border-top: 1px solid var(--border-subtle);
    font-size: 11px;
    color: var(--text-faint);
    flex-wrap: wrap;
    gap: 16px;
  }
  .legal-block {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 16px 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.7;
    margin-bottom: 36px;
  }
  .legal-block strong { color: var(--gold-primary); letter-spacing: 0.14em; }

  /* mobile nav handled by animation system */
  .menu-btn {
    display: none;
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-main);
    border-radius: 6px;
    padding: 8px 10px;
    cursor: pointer;
    transition: border-color 0.2s ease;
  }
  .menu-btn:hover { border-color: var(--gold-dim); }

  /* misc */
  /* ---------- language selector ---------- */
  .lang-selector {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    margin-right: 4px;
  }
  .lang-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 6px 8px;
    font-size: 10px;
    font-weight: 600;
    font-family: var(--font-mono);
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s ease;
  }
  .lang-btn:hover {
    color: var(--gold-light);
  }
  .lang-btn.active {
    background: rgba(212,175,55,0.15);
    color: var(--gold-primary);
  }
  @media (max-width: 820px) {
    .lang-selector { display: none; }
  }

  /* ---------- performance snapshot section ---------- */
  .performance-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 8px;
  }
  .perf-card {
    padding: 22px 20px;
    border-radius: var(--radius-md);
    background: rgba(212,175,55,0.02);
    text-align: left;
  }
  .perf-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--gold-primary);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: 14px;
  }
  .perf-value {
    font-size: 28px;
    font-weight: 300;
    color: var(--text-main);
    letter-spacing: -0.01em;
    font-family: var(--font-ui);
  }
  .perf-note {
    margin-top: 32px;
    padding: 16px 20px;
    background: rgba(0,0,0,0.3);
    border: 1px dashed var(--border-subtle);
    border-radius: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.7;
    letter-spacing: 0.02em;
  }

  ::selection { background: var(--gold-dim); color: #fff; }
  .small-cap-rule {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold-primary);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
</style>
</head>

  <div class="ambient-bg"></div>
  <div class="ambient-grid"></div>
