name: Apply P0 website claim corrections

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-p0-website-claims.yml

permissions:
  contents: write

jobs:
  apply-change:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct product claims in all languages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          website = Path("landing-v11.jsx")
          lines = website.read_text(encoding="utf-8").splitlines()

          copy = {
              ("en", "hero_lede"): "Previsio transforms proprietary price histories into quantitative forecasts and, when the available calibration evidence is sufficient, prediction intervals and model-based probabilities — then hands you a structured report, ready for internal review, already written. Every published number is traceable, reproducible and separate from any AI commentary.",
              ("en", "engine_h2b"): "Core quantitative outputs,",
              ("en", "engine_h2c"): "published only when supported.",
              ("en", "engine_lede"): "You configure a ticker, a target date, analysis depth and confidence level, and optionally a target threshold, threshold direction, price range and Time Travel reference date. The engine reads the selected dataset, runs up to eight forecasting models according to the horizon and available history, and weights the valid models by their historical performance on that asset. A valid completed run publishes the point forecast; the prediction interval and requested threshold or range probabilities are published only when their calibration samples pass the required adequacy and validation checks. Unsupported outputs are reported as not estimable rather than assigned an invented value. Given the same dataset, parameters and engine version, published outputs are reproducible.",
              ("en", "features_h2"): "Forecast, validated intervals and probabilities when estimable, and an automated report. One auditable process.",
              ("en", "analytics_h2"): "Core quantitative outputs, published only when supported by the data, plus an optional directional indicator.",
              ("en", "analytics_lede"): "A valid completed run presents the point forecast and supporting model diagnostics. The prediction interval, threshold probability and range probability are published only when their calibration samples and validation gates are sufficient; otherwise they are explicitly reported as not estimable. Threshold probability is derived from the empirical distribution of forecast errors. The optional directional probability comes from a separate classifier and is shown only when enabled and validated. Published results are consolidated in the report alongside diagnostics, model weights and the calculation log.",
              ("en", "data_lede"): "Previsio does not transmit market data to Previsio servers or external AI providers. The CSV and XLSX files you load are processed and retained locally on your device, where the engine performs every quantitative calculation.",
              ("en", "data_card2_body"): "In the Microsoft Store desktop application, market datasets, quantitative results, reports and narrative commentary are processed locally. Ollama is restricted to the client device and external cloud AI providers are disabled for product execution. Any technical communications required for licence activation remain separate from the local calculation workflow.",
              ("en", "tt_lede"): "Pick any past date and the system re-runs every calculation exactly as it would have on that day — with no knowledge of what came after. When it finishes, compare the forecast against what actually happened. Same publication rules. Same validation gates. Same calculation log. Verifiable against an outcome you already know.",

              ("it", "hero_lede"): "Previsio trasforma serie storiche proprietarie in forecast quantitativi e, quando l’evidenza di calibrazione disponibile è sufficiente, in intervalli di predizione e probabilità modellistiche — quindi genera un report strutturato e pronto per la revisione interna, senza che dobbiate scriverne una riga. Ogni numero pubblicato è tracciabile, riproducibile e separato dal commento AI.",
              ("it", "engine_h2b"): "Output quantitativi principali,",
              ("it", "engine_h2c"): "pubblicati solo quando supportati.",
              ("it", "engine_lede"): "Configurate un ticker, una data obiettivo, la profondità di analisi e il livello di confidenza, e facoltativamente una soglia di prezzo, la relativa direzione, un range di prezzo e una data di riferimento Time Travel. Il motore legge il dataset selezionato, esegue fino a otto modelli in funzione dell’orizzonte e dello storico disponibile e pesa i modelli validi in base ai risultati storici ottenuti su quell’asset. Un’esecuzione valida e completata pubblica il forecast puntuale; l’intervallo di predizione e le probabilità richieste sulla soglia o sul range vengono pubblicati solo quando i campioni di calibrazione superano i controlli di adeguatezza e validazione previsti. Gli output non supportati vengono indicati come non stimabili, senza attribuire valori inventati. A parità di dataset, parametri e versione del motore, gli output pubblicati sono riproducibili.",
              ("it", "features_h2"): "Forecast, intervalli validati e probabilità quando stimabili, più un report automatico. Un unico processo auditabile.",
              ("it", "analytics_h2"): "Output quantitativi principali, pubblicati solo quando supportati dai dati, più un indicatore direzionale opzionale.",
              ("it", "analytics_lede"): "Un’esecuzione valida e completata presenta il forecast puntuale e la diagnostica dei modelli. L’intervallo di predizione, la probabilità di soglia e la probabilità di chiusura nel range vengono pubblicati solo quando i rispettivi campioni di calibrazione e gate di validazione sono sufficienti; in caso contrario sono indicati esplicitamente come non stimabili. La probabilità di soglia deriva dalla distribuzione empirica degli errori previsionali. La probabilità direzionale opzionale è prodotta da un classificatore separato e viene mostrata solo quando è attivata e validata. I risultati pubblicati vengono consolidati nel report insieme a diagnostica, pesi dei modelli e registro di calcolo.",
              ("it", "data_lede"): "Previsio non trasmette i dati di mercato ai server di Previsio né a provider AI esterni. I file CSV e XLSX caricati vengono elaborati e conservati localmente sul vostro dispositivo, dove il motore esegue tutti i calcoli quantitativi.",
              ("it", "data_card2_body"): "Nell’applicazione desktop distribuita tramite Microsoft Store, dataset di mercato, risultati quantitativi, report e commento narrativo vengono elaborati localmente. Ollama è limitato al dispositivo del cliente e i provider AI cloud esterni sono disabilitati durante l’esecuzione del prodotto. Le eventuali comunicazioni tecniche necessarie all’attivazione della licenza restano separate dal flusso locale di calcolo.",
              ("it", "tt_lede"): "Scegliete una data passata qualsiasi e il sistema riesegue ogni calcolo esattamente come avrebbe fatto in quel giorno — senza sapere nulla di ciò che è accaduto dopo. Al termine, confrontate la previsione con quanto è realmente accaduto. Stesse regole di pubblicazione. Stessi gate di validazione. Stesso registro di calcolo. Verificabile rispetto a un esito che già conoscete.",

              ("fr", "hero_lede"): "Previsio transforme des historiques de prix propriétaires en prévisions quantitatives et, lorsque les éléments de calibration disponibles sont suffisants, en intervalles de prédiction et probabilités modélisées — puis génère un rapport structuré, déjà rédigé et prêt pour la revue interne. Chaque chiffre publié est traçable, reproductible et séparé de tout commentaire IA.",
              ("fr", "engine_h2b"): "Sorties quantitatives principales,",
              ("fr", "engine_h2c"): "publiées uniquement si elles sont étayées.",
              ("fr", "engine_lede"): "Vous configurez un ticker, une date cible, la profondeur d’analyse et le niveau de confiance, ainsi qu’en option un seuil de prix, sa direction, une fourchette de prix et une date de référence Time Travel. Le moteur lit le jeu de données sélectionné, exécute jusqu’à huit modèles selon l’horizon et l’historique disponible, puis pondère les modèles valides d’après leurs performances historiques sur l’actif. Une exécution valide et terminée publie la prévision ponctuelle ; l’intervalle de prédiction et les probabilités demandées sur le seuil ou la fourchette ne sont publiés que si leurs échantillons de calibration satisfont les contrôles d’adéquation et de validation requis. Les sorties insuffisamment étayées sont indiquées comme non estimables, sans valeur inventée. À jeu de données, paramètres et version du moteur identiques, les sorties publiées sont reproductibles.",
              ("fr", "features_h2"): "Prévision, intervalles validés et probabilités lorsqu’elles sont estimables, avec un rapport automatique. Un seul processus auditable.",
              ("fr", "analytics_h2"): "Sorties quantitatives principales, publiées uniquement si les données les étayent, avec un indicateur directionnel optionnel.",
              ("fr", "analytics_lede"): "Une exécution valide et terminée présente la prévision ponctuelle et les diagnostics des modèles. L’intervalle de prédiction, la probabilité de seuil et la probabilité de clôture dans la fourchette ne sont publiés que si leurs échantillons de calibration et leurs seuils de validation sont suffisants ; sinon, ils sont explicitement indiqués comme non estimables. La probabilité de seuil dérive de la distribution empirique des erreurs de prévision. La probabilité directionnelle optionnelle provient d’un classificateur séparé et n’est affichée que lorsqu’elle est activée et validée. Les résultats publiés sont consolidés dans le rapport avec les diagnostics, les pondérations des modèles et le journal de calcul.",
              ("fr", "data_lede"): "Previsio ne transmet pas les données de marché aux serveurs de Previsio ni à des fournisseurs d’IA externes. Les fichiers CSV et XLSX chargés sont traités et conservés localement sur votre appareil, où le moteur exécute tous les calculs quantitatifs.",
              ("fr", "data_card2_body"): "Dans l’application de bureau distribuée via Microsoft Store, les jeux de données de marché, les résultats quantitatifs, les rapports et les commentaires narratifs sont traités localement. Ollama est limité à l’appareil du client et les fournisseurs d’IA cloud externes sont désactivés pendant l’exécution du produit. Les communications techniques éventuellement nécessaires à l’activation de la licence restent séparées du flux de calcul local.",
              ("fr", "tt_lede"): "Choisissez une date passée et le système réexécute chaque calcul exactement comme il l’aurait fait ce jour-là, sans connaître la suite. Comparez ensuite la prévision au résultat réel. Mêmes règles de publication. Mêmes seuils de validation. Même journal de calcul. Le résultat est vérifiable par rapport à une issue que vous connaissez déjà.",

              ("de", "hero_lede"): "Previsio verwandelt proprietäre Preishistorien in quantitative Prognosen und, sofern ausreichende Kalibrierungsnachweise vorliegen, in Prognoseintervalle und modellbasierte Wahrscheinlichkeiten — anschließend erstellt die Plattform einen strukturierten, bereits formulierten Bericht für die interne Prüfung. Jede veröffentlichte Zahl ist nachvollziehbar, reproduzierbar und von KI-Kommentaren getrennt.",
              ("de", "engine_h2b"): "Zentrale quantitative Ergebnisse,",
              ("de", "engine_h2c"): "nur bei ausreichender Datengrundlage veröffentlicht.",
              ("de", "engine_lede"): "Sie konfigurieren einen Ticker, ein Zieldatum, die Analysetiefe und das Konfidenzniveau sowie optional eine Preisschwelle, deren Richtung, eine Preisspanne und ein Time-Travel-Referenzdatum. Die Engine liest den ausgewählten Datensatz, führt abhängig von Horizont und verfügbarer Historie bis zu acht Prognosemodelle aus und gewichtet die gültigen Modelle nach ihrer historischen Leistung für den jeweiligen Vermögenswert. Ein gültiger, abgeschlossener Lauf veröffentlicht die Punktprognose; das Prognoseintervall und angeforderte Schwellen- oder Spannenwahrscheinlichkeiten werden nur veröffentlicht, wenn ihre Kalibrierungsstichproben die erforderlichen Eignungs- und Validierungsprüfungen bestehen. Nicht ausreichend gestützte Ergebnisse werden als nicht schätzbar ausgewiesen, statt mit erfundenen Werten belegt zu werden. Bei identischem Datensatz, identischen Parametern und gleicher Engine-Version sind die veröffentlichten Ergebnisse reproduzierbar.",
              ("de", "features_h2"): "Prognose, validierte Intervalle und Wahrscheinlichkeiten, sofern schätzbar, sowie ein automatisierter Bericht. Ein prüfbarer Prozess.",
              ("de", "analytics_h2"): "Zentrale quantitative Ergebnisse, nur bei ausreichender Datengrundlage veröffentlicht, ergänzt um einen optionalen Richtungsindikator.",
              ("de", "analytics_lede"): "Ein gültiger, abgeschlossener Lauf zeigt die Punktprognose und die unterstützenden Modelldiagnosen. Prognoseintervall, Schwellenwahrscheinlichkeit und Spannenwahrscheinlichkeit werden nur veröffentlicht, wenn die jeweiligen Kalibrierungsstichproben und Validierungsschwellen ausreichend sind; andernfalls werden sie ausdrücklich als nicht schätzbar ausgewiesen. Die Schwellenwahrscheinlichkeit wird aus der empirischen Verteilung historischer Prognosefehler abgeleitet. Die optionale Richtungswahrscheinlichkeit stammt aus einem separaten Klassifikator und wird nur angezeigt, wenn sie aktiviert und validiert ist. Veröffentlichte Ergebnisse werden zusammen mit Diagnosen, Modellgewichten und Berechnungsprotokoll im Bericht konsolidiert.",
              ("de", "data_lede"): "Previsio übermittelt Marktdaten weder an Previsio-Server noch an externe KI-Anbieter. Geladene CSV- und XLSX-Dateien werden lokal auf Ihrem Gerät verarbeitet und gespeichert; dort führt die Engine sämtliche quantitativen Berechnungen aus.",
              ("de", "data_card2_body"): "In der über den Microsoft Store vertriebenen Desktopanwendung werden Marktdatensätze, quantitative Ergebnisse, Berichte und narrative Kommentare lokal verarbeitet. Ollama ist auf das Gerät des Kunden beschränkt; externe Cloud-KI-Anbieter sind während der Produktausführung deaktiviert. Etwaige technische Kommunikation zur Lizenzaktivierung bleibt vom lokalen Berechnungsablauf getrennt.",
              ("de", "tt_lede"): "Wählen Sie ein beliebiges früheres Datum. Das System führt jede Berechnung genau so aus, wie es sie an diesem Tag durchgeführt hätte — ohne Kenntnis späterer Ereignisse. Vergleichen Sie anschließend die Prognose mit dem tatsächlichen Ergebnis. Gleiche Veröffentlichungsregeln. Gleiche Validierungsschwellen. Gleiches Berechnungsprotokoll. Überprüfbar anhand eines bereits bekannten Ergebnisses.",
          }

          inside_translations = False
          language = None
          seen = {key: 0 for key in copy}
          output = []

          distribution_seen = {"h2": 0, "lede": 0, "step02": 0}
          in_distribution = False

          distribution_h2 = "    h2: { en: 'A Windows desktop application, available on Microsoft Store.', it: 'Un’applicazione desktop Windows, disponibile su Microsoft Store.', fr: 'Une application de bureau Windows, disponible sur Microsoft Store.', de: 'Eine Windows-Desktopanwendung, verfügbar im Microsoft Store.' },"
          distribution_lede = "    lede: { en: 'Previsio is available as a Windows desktop application through Microsoft Store. After the service is activated, the client receives credentials and access instructions from Previsio. In the standard configuration, datasets, models, quantitative calculations, reports and AI commentary are processed on the user’s own device.', it: 'Previsio è disponibile come applicazione desktop Windows tramite Microsoft Store. Dopo l’attivazione del servizio, il cliente riceve da Previsio le credenziali e le istruzioni necessarie per accedere. Nella configurazione standard, dataset, modelli, calcoli quantitativi, report e commento AI vengono elaborati sul dispositivo dell’utente.', fr: 'Previsio est disponible sous forme d’application de bureau Windows via Microsoft Store. Après l’activation du service, le client reçoit de Previsio les identifiants et les instructions d’accès nécessaires. Dans la configuration standard, les jeux de données, les modèles, les calculs quantitatifs, les rapports et les commentaires IA sont traités sur l’appareil de l’utilisateur.', de: 'Previsio ist als Windows-Desktopanwendung über den Microsoft Store verfügbar. Nach der Aktivierung des Dienstes erhält der Kunde von Previsio die erforderlichen Zugangsdaten und Anweisungen. In der Standardkonfiguration werden Datensätze, Modelle, quantitative Berechnungen, Berichte und KI-Kommentare auf dem Gerät des Nutzers verarbeitet.' }"
          distribution_step02 = "  { n: '02', t: { en: 'Available on Microsoft Store', it: 'Disponibile su Microsoft Store', fr: 'Disponible sur Microsoft Store', de: 'Im Microsoft Store verfügbar' }, d: { en: 'The client can download Previsio from Microsoft Store and install it directly on a compatible Windows computer.', it: 'Il cliente può scaricare Previsio da Microsoft Store e installarlo direttamente su un computer Windows compatibile.', fr: 'Le client peut télécharger Previsio depuis Microsoft Store et l’installer directement sur un ordinateur Windows compatible.', de: 'Der Kunde kann Previsio aus dem Microsoft Store herunterladen und direkt auf einem kompatiblen Windows-Computer installieren.' } },"

          for line in lines:
              stripped = line.strip()

              if stripped == "const T = {":
                  inside_translations = True
              elif inside_translations and stripped in {"en: {", "it: {", "fr: {", "de: {"}:
                  language = stripped[:2]
              elif inside_translations and stripped.startswith("const LanguageContext"):
                  inside_translations = False
                  language = None

              if inside_translations and language:
                  replaced = False
                  for (target_language, key), value in copy.items():
                      if target_language == language and line.startswith(f"    {key}:"):
                          output.append(f"    {key}: {json.dumps(value, ensure_ascii=False)},")
                          seen[(target_language, key)] += 1
                          replaced = True
                          break
                  if replaced:
                      continue

              if stripped == "function DistributionAccess() {":
                  in_distribution = True
              elif in_distribution and stripped.startswith("function Pricing("):
                  in_distribution = False

              if in_distribution and line.startswith("    h2: { en:"):
                  output.append(distribution_h2)
                  distribution_seen["h2"] += 1
                  continue
              if in_distribution and line.startswith("    lede: { en:"):
                  output.append(distribution_lede)
                  distribution_seen["lede"] += 1
                  continue
              if in_distribution and stripped.startswith("{ n: '02'"):
                  output.append(distribution_step02)
                  distribution_seen["step02"] += 1
                  continue

              output.append(line)

          missing = [f"{lang}.{key}={count}" for (lang, key), count in seen.items() if count != 1]
          if missing:
              raise SystemExit("Translation replacement count mismatch: " + ", ".join(missing))

          bad_distribution = [f"{key}={count}" for key, count in distribution_seen.items() if count != 1]
          if bad_distribution:
              raise SystemExit("Distribution replacement count mismatch: " + ", ".join(bad_distribution))

          content = "\n".join(output) + "\n"

          banned = [
              "does not collect, relay or store market data",
              "non raccoglie, non trasmette e non archivia dati di mercato",
              "will be available as a Windows desktop application",
              "sarà disponibile come applicazione desktop Windows",
              "Once published, the client will be able",
              "Una volta pubblicato, il cliente potrà",
              "delivers four computed outputs",
              "produce quattro output calcolati",
              "Same four outputs",
              "Stessi quattro output",
          ]
          remaining = [phrase for phrase in banned if phrase in content]
          if remaining:
              raise SystemExit("Obsolete claims remain: " + ", ".join(remaining))

          website.write_text(content, encoding="utf-8")
          Path(".github/workflows/fix-p0-website-claims.yml").unlink()
          PY

      - name: Validate corrected copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('landing-v11.jsx').read_text(encoding='utf-8')
          required = [
              'Previsio è disponibile come applicazione desktop Windows tramite Microsoft Store.',
              'I file CSV e XLSX caricati vengono elaborati e conservati localmente',
              'Gli output non supportati vengono indicati come non stimabili',
              'Same publication rules. Same validation gates.',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Required corrected copy missing: ' + ', '.join(missing))
          PY

      - name: Commit corrections to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing-v11.jsx .github/workflows/fix-p0-website-claims.yml
          git commit -m "Correct website product and Store claims"
          git push origin HEAD:main
