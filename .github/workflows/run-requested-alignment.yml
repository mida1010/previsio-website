name: Run requested alignment

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested changes
        run: python3 .github/scripts/apply_requested_alignment.py

      - name: Commit changes and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f alignment-trigger.txt
          rm -f alignment-run-trigger.txt
          rm -f homepage-order-diagnostic.txt
          rm -f alignment-diagnostic.txt
          rm -f .github/scripts/apply_requested_alignment.py
          rm -f .github/workflows/apply-final-requested-alignment.yml
          rm -f .github/workflows/apply-p1-p2-marketing-alignment.yml
          rm -f .github/workflows/apply-p1-p2-marketing-alignment-v2.yml
          rm -f .github/workflows/finalize-p1-p2-alignment.yml
          rm -f .github/workflows/apply-p2-founder-positioning.yml
          rm -f .github/workflows/apply-p2-founder-positioning-v2.yml
          rm -f .github/workflows/apply-p2-founder-positioning-v3.yml
          rm -f .github/workflows/apply-p2-founder-positioning-v4.yml
          rm -f .github/workflows/apply-p2-product-proof-order.yml
          rm -f .github/workflows/complete-requested-site-alignment.yml
          rm -f .github/workflows/apply-homepage-order-indexed.yml
          rm -f .github/workflows/diagnose-and-apply-homepage-order.yml
          rm -f .github/workflows/run-requested-alignment.yml
          git add -A
          git diff --cached --check
          git commit -m "Complete requested P1 and P2 website changes"
          git push origin main
