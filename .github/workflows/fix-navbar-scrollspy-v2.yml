name: Fix navbar scroll-spy v2

on:
  push:
    branches:
      - main
    paths:
      - navbar-scrollspy-trigger-v2.txt

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply DOM-order-independent scroll-spy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('landing-v11.jsx')
          text = path.read_text(encoding='utf-8')

          old = """    const handleScroll = () => {
      const navH = 72;
      let current = '';
      for (const id of sectionIds) {
        const el = document.getElementById(id);
        if (!el) continue;
        const top = el.getBoundingClientRect().top;
        if (top <= navH + 60) current = id;
      }
      setActiveId(current);
    };"""

          new = """    const handleScroll = () => {
      const navH = 72;
      const activationLine = navH + 60;
      let current = '';
      let closestTop = Number.NEGATIVE_INFINITY;

      for (const id of sectionIds) {
        const el = document.getElementById(id);
        if (!el) continue;

        const top = el.getBoundingClientRect().top;
        if (top <= activationLine && top > closestTop) {
          closestTop = top;
          current = id;
        }
      }

      setActiveId(current);
    };"""

          if text.count(old) != 1:
              raise RuntimeError(f'Expected one legacy scroll-spy block, found {text.count(old)}')

          text = text.replace(old, new, 1)

          if text.count('let closestTop = Number.NEGATIVE_INFINITY;') != 1:
              raise RuntimeError('Corrected scroll-spy block missing or duplicated')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit corrected navbar and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f navbar-scrollspy-trigger.txt
          rm -f navbar-scrollspy-trigger-v2.txt
          rm -f .github/workflows/fix-navbar-scrollspy.yml
          rm -f .github/workflows/fix-navbar-scrollspy-v2.yml
          git add -A
          git diff --cached --check
          git commit -m "Fix navbar active section after homepage reorder"
          git push origin main
