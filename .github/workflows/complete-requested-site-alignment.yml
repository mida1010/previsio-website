name: Complete requested site alignment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-requested-site-alignment.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align product claims and homepage order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lp = Path('landing-v11.jsx')
          pp = Path('privacy.html')
          ep = Path('eula.html')
          landing = lp.read_text(encoding='utf-8')
          privacy = pp.read_text(encoding='utf-8')
          eula = ep.read_text(encoding='utf-8')

          vs = 'function PerformanceSnapshot() {'
          ve = 'const PX_DOCS_URL ='
          validation_before = landing.split(vs, 1)[1].split(ve, 1)[0]

          def replace_line(text, token, replacement):
              lines = text.splitlines()
              found = False
              for i, line in enumerate(lines):
                  if token in line:
                      lines[i] = replacement
                      found = True
              if not found:
                  raise SystemExit(f'Line token not found: {token}')
              return '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          # P1.2 — local Ollama only in the Microsoft Store product.
          feature_lines = {
              "If a cloud configuration is requested": "    ['Your data, your source, your control', 'In the Microsoft Store desktop version, market files, quantitative calculations and Ollama-generated commentary are processed locally on the client device. External cloud AI providers and remote LLM endpoints are not supported by the standard product.'],",
              "Qualora venga richiesta una configurazione cloud": "    ['I vostri dati, la vostra fonte, il vostro controllo', 'Nella versione desktop distribuita tramite Microsoft Store, file di mercato, calcoli quantitativi e commento generato tramite Ollama vengono elaborati localmente sul dispositivo del cliente. Provider AI cloud esterni ed endpoint LLM remoti non sono supportati dal prodotto standard.'],",
              "Si une configuration cloud est demandée": "    ['Vos données, votre source, votre contrôle', 'Dans la version desktop distribuée via Microsoft Store, les fichiers de marché, les calculs quantitatifs et le commentaire généré via Ollama sont traités localement sur l’appareil du client. Les fournisseurs d’IA cloud externes et les endpoints LLM distants ne sont pas pris en charge par le produit standard.'],",
              "Wird eine Cloud-Konfiguration angefragt": "    ['Ihre Daten, Ihre Quelle, Ihre Kontrolle', 'In der über den Microsoft Store vertriebenen Desktopversion werden Marktdateien, quantitative Berechnungen und der über Ollama erzeugte Kommentar lokal auf dem Gerät des Kunden verarbeitet. Externe Cloud-KI-Anbieter und entfernte LLM-Endpunkte werden vom Standardprodukt nicht unterstützt.'],",
          }
          for token, line in feature_lines.items():
              if token in landing:
                  landing = replace_line(landing, token, line)

          pricing_lines = {
              "Local configuration via Ollama is the standard mode.": "              en: 'The Microsoft Store desktop version uses only Ollama running locally on the client device. External cloud AI providers, remote LLM endpoints and dedicated cloud infrastructure are not part of the standard product or licence. Any future enterprise deployment would require a separate, explicitly documented technical and contractual project.',",
              "La configurazione locale tramite Ollama è la modalità standard.": "              it: 'La versione desktop distribuita tramite Microsoft Store utilizza esclusivamente Ollama in esecuzione locale sul dispositivo del cliente. Provider AI cloud esterni, endpoint LLM remoti e infrastrutture cloud dedicate non fanno parte del prodotto o della licenza standard. Qualsiasi futuro deployment enterprise richiederebbe un progetto tecnico e contrattuale separato ed esplicitamente documentato.',",
              "La configuration locale via Ollama est le mode standard.": "              fr: 'La version desktop distribuée via Microsoft Store utilise exclusivement Ollama exécuté localement sur l’appareil du client. Les fournisseurs d’IA cloud externes, les endpoints LLM distants et les infrastructures cloud dédiées ne font pas partie du produit ni de la licence standard. Tout futur déploiement enterprise nécessiterait un projet technique et contractuel séparé et explicitement documenté.',",
              "Die lokale Konfiguration über Ollama ist der Standardmodus.": "              de: 'Die über den Microsoft Store vertriebene Desktopversion verwendet ausschließlich Ollama lokal auf dem Gerät des Kunden. Externe Cloud-KI-Anbieter, entfernte LLM-Endpunkte und dedizierte Cloud-Infrastruktur sind nicht Bestandteil des Standardprodukts oder der Standardlizenz. Jede künftige Enterprise-Bereitstellung würde ein separates, ausdrücklich dokumentiertes technisches und vertragliches Projekt erfordern.'",
          }
          for token, line in pricing_lines.items():
              if token in landing:
                  landing = replace_line(landing, token, line)

          if 'Any optional cloud services use only the content and data flows agreed before activation.' in landing:
              landing = replace_line(
                  landing,
                  'Any optional cloud services use only the content and data flows agreed before activation.',
                  "    d: { en: 'Encrypted authentication with credentials kept out of every log. In the Microsoft Store desktop version, datasets, quantitative results, reports and narrative commentary remain within the client’s local environment. Only the minimum technical data required for licence activation may leave the calculation perimeter.', it: 'Autenticazione cifrata con credenziali escluse da ogni log. Nella versione desktop distribuita tramite Microsoft Store, dataset, risultati quantitativi, report e commento narrativo rimangono nell’ambiente locale del cliente. Solo i dati tecnici minimi necessari all’attivazione della licenza possono uscire dal perimetro di calcolo.', fr: 'Authentification chiffrée avec identifiants exclus de tous les journaux. Dans la version desktop distribuée via Microsoft Store, les jeux de données, résultats quantitatifs, rapports et commentaires narratifs restent dans l’environnement local du client. Seules les données techniques minimales nécessaires à l’activation de la licence peuvent quitter le périmètre de calcul.', de: 'Verschlüsselte Authentifizierung, wobei Anmeldedaten aus allen Protokollen ausgeschlossen bleiben. In der über den Microsoft Store vertriebenen Desktopversion verbleiben Datensätze, quantitative Ergebnisse, Berichte und narrative Kommentare in der lokalen Umgebung des Kunden. Nur die für die Lizenzaktivierung erforderlichen minimalen technischen Daten dürfen den Berechnungsperimeter verlassen.' } },"
              )

          landing = landing.replace(
              'AI PROCESSING — local Ollama disclosure + optional cloud config',
              'AI PROCESSING — local Ollama disclosure'
          )

          # Remove cloud-AI configuration object.
          if '  const cloud = {' in landing:
              i = landing.index('  const cloud = {')
              j = landing.index('  const itemGrid =', i)
              landing = landing[:i] + landing[j:]

          # Remove the rendered cloud-provider card, retaining the local Ollama card.
          cloud_card = '        <div className="card" style={{ maxWidth: 980, margin: \'28px auto 0\''
          if cloud_card in landing:
              i = landing.index(cloud_card)
              j = landing.index('        <style>', i)
              landing = landing[:i] + landing[j:]

          # P2.8 — concrete product proof immediately after Hero.
          app_start = landing.index('function App() {')
          hero = landing.index('      <Hero />', app_start)
          data = landing.index('      <DataPrivacy />', hero)
          ordered = """      <Hero />
      <DashboardPreview />
      <ReportDownload />

      <ModelsPipeline />
      <Features />
      <AnalyticsSection />
      <Methodology />
      <AdvancedCapabilities />
      <PerformanceSnapshot />
      <UseCases />
"""
          landing = landing[:hero] + ordered + landing[data:]

          # Correct any transient multilingual typo if present.
          landing = landing.replace('sous controllo umano', 'sous contrôle humain')

          # Privacy notice — no remote LLM route in the standard Store product.
          def replace_section(text, start, end, replacement):
              if start in text:
                  i = text.index(start)
                  j = text.index(end, i)
                  return text[:i] + replacement + text[j:]
              return text

          privacy = replace_section(
              privacy,
              '  <h2>9. Optional AI/LLM services</h2>',
              '  <h2>10. Optional Telegram delivery</h2>',
              """  <h2>9. Local AI commentary</h2>
  <p>
    The Microsoft Store desktop version may generate narrative commentary through Ollama running
    locally on the User's device. Market datasets, quantitative results and report content used by
    this function are not sent to external AI providers. Remote LLM endpoints and third-party cloud
    AI providers are not supported by the standard Microsoft Store product.
  </p>
  <p>
    The language model produces qualitative narrative commentary only. Forecasts, probabilities,
    metrics, formulas and all other numerical results are calculated by the Software's quantitative
    engine before the commentary stage.
  </p>

"""
          )
          privacy = replace_section(
              privacy,
              '  <h2>9. Servizi opzionali di intelligenza artificiale (AI/LLM)</h2>',
              '  <h2>10. Consegna opzionale tramite Telegram</h2>',
              """  <h2>9. Commento AI locale</h2>
  <p>
    La versione desktop distribuita tramite Microsoft Store può generare commenti narrativi tramite
    Ollama in esecuzione locale sul dispositivo dell'Utente. I dataset di mercato, i risultati
    quantitativi e i contenuti del report utilizzati da questa funzione non vengono inviati a provider
    AI esterni. Endpoint LLM remoti e provider AI cloud di terze parti non sono supportati dal prodotto
    standard distribuito tramite Microsoft Store.
  </p>
  <p>
    Il modello linguistico produce esclusivamente commenti narrativi qualitativi. Forecast,
    probabilità, metriche, formule e ogni altro risultato numerico sono calcolati dal motore
    quantitativo del Software prima della fase di commento.
  </p>

"""
          )
          privacy = privacy.replace('API keys for optional LLM/cloud services', 'credentials required by supported optional features')
          privacy = privacy.replace('chiavi API per servizi LLM/cloud opzionali', 'credenziali richieste dalle funzionalità opzionali supportate')
          privacy = privacy.replace('cloud LLMs, Telegram, etc.', 'Telegram and other supported third-party delivery services')
          privacy = privacy.replace('LLM cloud, Telegram, ecc.', 'Telegram e altri servizi di consegna di terze parti supportati')
          privacy = privacy.replace('cloud LLMs,\n    Telegram, etc.', 'Telegram and other supported third-party delivery services')
          privacy = privacy.replace('LLM cloud,\n    Telegram, ecc.', 'Telegram e altri servizi di consegna di terze parti supportati')

          # EULA — standard licence does not permit remote LLM/cloud AI configuration.
          eula = eula.replace(
              "Certain optional features may integrate\n    with third-party services (for example a local language model or, if\n    configured by the User, a cloud service); in such cases the relevant\n    provider's terms apply, and the User undertakes to comply with them.",
              "Certain optional features may integrate with supported third-party delivery\n    services. Narrative AI commentary in the Microsoft Store desktop version uses a local\n    Ollama model only; remote LLM endpoints and cloud AI providers are not supported by the\n    standard product. Where a supported third-party delivery service is configured, the\n    relevant provider's terms apply and the User undertakes to comply with them."
          )
          eula = eula.replace(
              "Alcune funzionalità opzionali possono integrarsi con servizi di terze parti (ad esempio un modello linguistico locale o, se configurato dall'Utente, un servizio cloud); in tali casi si applicano le condizioni del relativo fornitore e l'Utente si impegna a rispettarle.",
              "Alcune funzionalità opzionali possono integrarsi con servizi di consegna di terze parti supportati. Nella versione desktop distribuita tramite Microsoft Store, il commento AI utilizza esclusivamente un modello Ollama locale; endpoint LLM remoti e provider AI cloud non sono supportati dal prodotto standard. Quando viene configurato un servizio di consegna di terze parti supportato, si applicano le condizioni del relativo fornitore e l'Utente si impegna a rispettarle."
          )

          validation_after = landing.split(vs, 1)[1].split(ve, 1)[0]
          if validation_after != validation_before:
              raise SystemExit('Validation section changed')

          forbidden = [
              'Cloud AI provider chosen by the client.',
              'Provider AI cloud scelto dal cliente.',
              'If a cloud configuration is requested',
              'Qualora venga richiesta una configurazione cloud',
              "{ name: 'Claude'", "{ name: 'ChatGPT'", "{ name: 'Grok'", "{ name: 'Gemini'",
          ]
          for token in forbidden:
              if token in landing:
                  raise SystemExit(f'Legacy marketing claim remains: {token}')

          required = [
              'The Microsoft Store desktop version uses only Ollama',
              '<Hero />\n      <DashboardPreview />\n      <ReportDownload />',
              'Documented CSV and XLSX imports',
              'AI-assisted engineering under human control',
          ]
          for token in required:
              if token not in landing:
                  raise SystemExit(f'Required final copy missing: {token}')

          lp.write_text(landing, encoding='utf-8')
          pp.write_text(privacy, encoding='utf-8')
          ep.write_text(eula, encoding='utf-8')
          PY

      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-p1-p2-marketing-alignment.yml
          rm -f .github/workflows/apply-p1-p2-marketing-alignment-v2.yml
          rm -f .github/workflows/finalize-p1-p2-alignment.yml
          rm -f .github/workflows/apply-p2-founder-positioning.yml
          rm -f .github/workflows/apply-p2-founder-positioning-v2.yml
          rm -f .github/workflows/apply-p2-founder-positioning-v3.yml
          rm -f .github/workflows/apply-p2-founder-positioning-v4.yml
          rm -f .github/workflows/apply-p2-product-proof-order.yml
          rm -f .github/workflows/complete-requested-site-alignment.yml
          git add -A
          git diff --cached --check
          git commit -m "Complete requested P1 and P2 website alignment"
          git push origin main
