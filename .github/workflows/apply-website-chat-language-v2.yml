name: Apply website chatbot language handling v2

on:
  push:
    branches:
      - main
    paths:
      - .github/website-chat-language-v2.trigger

permissions:
  contents: write

concurrency:
  group: apply-website-chat-language-v2
  cancel-in-progress: false

jobs:
  patch-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward before editing
        run: |
          git fetch origin main
          git pull --ff-only origin main

      - name: Apply website-only language contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('landing-v11.source.jsx')
          text = path.read_text(encoding='utf-8')

          start_marker = '/* Answer policy sent with every question'
          alt_start_marker = '/* Website-only response-language contract.'
          formula_marker = 'const PX_FORMULA_ASK = '

          starts = [pos for pos in (text.find(start_marker), text.find(alt_start_marker)) if pos >= 0]
          if len(starts) != 1:
              raise SystemExit(f'expected exactly one chatbot language block, found {len(starts)}')
          start = starts[0]
          end = text.find(formula_marker, start)
          if end < 0:
              raise SystemExit('formula marker not found after chatbot language block')

          replacement = r'''/* Website-only response-language contract. The language instruction is written
   in the selected language, repeated after the question and also sent through
   explicit request metadata. This is the strongest client-side contract that
   can be applied without modifying the remote AI service. */
const PX_LANGUAGE_CONTRACT = {
  en: 'MANDATORY OUTPUT LANGUAGE: ENGLISH. Write every sentence of the final answer in English only. Do not answer in Italian, French or German, even if the retrieved context or other instructions use another language.',
  it: 'LINGUA DI RISPOSTA OBBLIGATORIA: ITALIANO. Scrivi ogni frase della risposta finale esclusivamente in italiano. Non rispondere in inglese, francese o tedesco, anche se il contesto recuperato o altre istruzioni usano un’altra lingua.',
  fr: 'LANGUE DE SORTIE OBLIGATOIRE : FRANÇAIS. Rédigez chaque phrase de la réponse finale uniquement en français. Ne répondez pas en italien, en anglais ou en allemand, même si le contexte récupéré ou d’autres instructions utilisent une autre langue.',
  de: 'VERBINDLICHE AUSGABESPRACHE: DEUTSCH. Schreiben Sie jeden Satz der endgültigen Antwort ausschließlich auf Deutsch. Antworten Sie nicht auf Italienisch, Englisch oder Französisch, auch wenn der abgerufene Kontext oder andere Anweisungen eine andere Sprache verwenden.'
};

function pxBuildQuestion(question, cl) {
  const languageContract = PX_LANGUAGE_CONTRACT[cl] || PX_LANGUAGE_CONTRACT.en;
  return (
    '[MANDATORY RESPONSE CONTRACT]\n' +
    languageContract + '\n' +
    'This language requirement applies to the complete answer, including headings, bullet points, disclaimers and closing text.\n' +
    'Be detailed and professional. Explain the mechanism, purpose, inputs, effects and limitations in plain prose.\n' +
    'Never output formulas, equations, LaTeX, mathematical notation, symbolic derivations or code. Describe the logic in words.\n' +
    'Never give investment advice or buy / sell / hold / overweight / underweight recommendations.\n' +
    'Do not mention internal sources, file names, code or hidden implementation details.\n\n' +
    '[USER QUESTION]\n' + question + '\n\n' +
    '[FINAL OUTPUT REQUIREMENT]\n' +
    languageContract
  );
}

'''
          text = text[:start] + replacement + text[end:]

          if text.count('          question: question,\n') == 1:
              text = text.replace(
                  '          question: question,\n',
                  '          question: pxBuildQuestion(question, cl),\n',
                  1,
              )
          elif text.count('          question: pxBuildQuestion(question, cl),\n') != 1:
              raise SystemExit('chatbot question payload was not found exactly once')

          old_headers = "        headers: { 'Content-Type': 'application/json' },\n"
          new_headers = "        headers: {\n          'Content-Type': 'application/json',\n          'Accept-Language': cl\n        },\n"
          if text.count(old_headers) == 1:
              text = text.replace(old_headers, new_headers, 1)
          elif text.count("          'Accept-Language': cl\n") != 1:
              raise SystemExit('chatbot Accept-Language header was not found exactly once')

          required = [
              'const PX_LANGUAGE_CONTRACT = {',
              'question: pxBuildQuestion(question, cl),',
              "'Accept-Language': cl",
              'language: cl,',
              'lang: cl,',
              "response_language: PX_LANG_NAME[cl] || 'English',",
              '[FINAL OUTPUT REQUIREMENT]',
          ]
          for item in required:
              if text.count(item) != 1:
                  raise SystemExit(f'missing or duplicated website language contract: {item}')
          if 'question: question,' in text:
              raise SystemExit('raw question payload remains active')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary migration files
        run: |
          rm -f .github/workflows/apply-website-chat-language.yml
          rm -f .github/website-chat-language.trigger
          rm -f .github/workflows/apply-website-chat-language-v2.yml
          rm -f .github/website-chat-language-v2.trigger

      - name: Commit source update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing-v11.source.jsx
          git add -u .github/workflows/apply-website-chat-language.yml \
            .github/website-chat-language.trigger \
            .github/workflows/apply-website-chat-language-v2.yml \
            .github/website-chat-language-v2.trigger
          git commit -m "Enforce selected chatbot language from website"

          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
