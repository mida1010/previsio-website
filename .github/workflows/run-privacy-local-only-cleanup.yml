name: Run privacy local-only cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/cleanup_privacy_local_only.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f privacy-cleanup-trigger.txt
          rm -f .github/scripts/cleanup_privacy_local_only.py
          rm -f .github/workflows/run-privacy-local-only-cleanup.yml
          git add -A
          git diff --cached --check
          git commit -m "Remove residual cloud AI wording from privacy notice"
          git push origin main
