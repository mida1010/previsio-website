name: Move product proof after hero

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-p2-product-proof-order.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reorder homepage sections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('landing-v11.jsx')
          s = p.read_text(encoding='utf-8')
          old = """      <Hero />

      <ModelsPipeline />
      <Features />
      <AnalyticsSection />
      <Methodology />
      <AdvancedCapabilities />
      <PerformanceSnapshot />
      <UseCases />
      <DashboardPreview />
      <ReportDownload />
      <DataPrivacy />"""
          new = """      <Hero />
      <DashboardPreview />
      <ReportDownload />

      <ModelsPipeline />
      <Features />
      <AnalyticsSection />
      <Methodology />
      <AdvancedCapabilities />
      <PerformanceSnapshot />
      <UseCases />
      <DataPrivacy />"""
          if old not in s:
              raise SystemExit('Original homepage section order not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing-v11.jsx
          git diff --cached --check
          git commit -m "Surface product interface and report after hero"
          git push origin main
