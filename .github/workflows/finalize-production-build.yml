name: Finalize production build workflow

on:
  push:
    branches:
      - main
    paths:
      - .github/finalize-production-build.trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install permanent production verification
        shell: bash
        run: |
          cat > scripts/verify-production.mjs <<'EOF'
          import { readFile, stat } from 'node:fs/promises';
          import path from 'node:path';

          const root = process.cwd();

          async function read(relativePath) {
            return readFile(path.join(root, relativePath), 'utf8');
          }

          async function assertFileExists(relativePath) {
            const info = await stat(path.join(root, relativePath));
            if (!info.isFile() || info.size === 0) {
              throw new Error(`${relativePath} is missing or empty.`);
            }
          }

          const requiredFiles = [
            'index.html',
            'landing-v11.source.jsx',
            'landing-v11.jsx',
            'landing-v11.loader.js',
            'landing-v11.bootstrap.js',
            'landing-v11.bundle.js',
            'mobile-responsive.css',
            'founder-education-fix.js',
            'Request.html',
            'faq.html',
            'faq-data.js',
            'terms.html',
            'privacy.html',
            'eula.html',
            'package-lock.json'
          ];

          for (const relativePath of requiredFiles) {
            await assertFileExists(relativePath);
          }

          const [index, sourceLoader, productionLoader, bootstrap, bundle] = await Promise.all([
            read('index.html'),
            read('landing-v11.jsx'),
            read('landing-v11.loader.js'),
            read('landing-v11.bootstrap.js'),
            read('landing-v11.bundle.js')
          ]);

          if (sourceLoader !== productionLoader) {
            throw new Error('landing-v11.loader.js must remain byte-identical to the verified website loader.');
          }

          if (!index.includes('<script src="landing-v11.loader.js?v=20260805"></script>')) {
            throw new Error('index.html does not load the production website loader.');
          }

          if (!bootstrap.includes('data-previsio-production-bundle')) {
            throw new Error('landing-v11.bootstrap.js does not load the production bundle.');
          }

          const forbiddenRuntimeDependencies = [
            'react.development.js',
            'react-dom.development.js',
            '@babel/standalone',
            'babel.min.js',
            'Babel.transform',
            'text/babel'
          ];

          for (const forbidden of forbiddenRuntimeDependencies) {
            if (index.includes(forbidden) || bootstrap.includes(forbidden) || bundle.includes(forbidden)) {
              throw new Error(`Production output contains forbidden runtime dependency: ${forbidden}`);
            }
          }

          if (bootstrap.includes("fetch(sourceUrl, { cache: 'no-cache' })")) {
            throw new Error('The website is still fetching JSX for runtime compilation.');
          }

          console.log('Production verification passed. React is bundled and no runtime JSX compiler is loaded.');
          EOF

          cat > .github/workflows/build-production-bundle.yml <<'EOF'
          name: Build production website bundle

          on:
            push:
              branches:
                - main
              paths:
                - package.json
                - package-lock.json
                - scripts/build-production.mjs
                - scripts/verify-production.mjs
                - landing-v11.source.jsx
                - landing-v11.jsx
                - landing-v11.bootstrap.js
                - index.html
                - .github/workflows/build-production-bundle.yml
            workflow_dispatch:

          permissions:
            contents: write

          concurrency:
            group: previsio-production-bundle
            cancel-in-progress: false

          jobs:
            build-verify-publish:
              runs-on: ubuntu-latest

              steps:
                - name: Check out main
                  uses: actions/checkout@v4
                  with:
                    ref: main
                    fetch-depth: 0

                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: package-lock.json

                - name: Install exact dependencies
                  run: npm ci --ignore-scripts --no-audit --no-fund

                - name: Generate production bundle
                  run: npm run build

                - name: Verify production output
                  run: npm run verify:production

                - name: Validate generated JavaScript syntax
                  shell: bash
                  run: |
                    node --check landing-v11.loader.js
                    node --check landing-v11.bootstrap.js
                    node --check landing-v11.bundle.js

                - name: Verify generated-file scope
                  shell: bash
                  run: |
                    git status --short
                    python3 - <<'PY'
                    import subprocess

                    allowed = {
                        'index.html',
                        'landing-v11.bootstrap.js',
                        'landing-v11.bundle.js',
                        'landing-v11.loader.js',
                        'package-lock.json',
                    }
                    output = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
                    changed = {line[3:] for line in output.splitlines() if line.strip()}
                    unexpected = sorted(changed - allowed)
                    if unexpected:
                        raise SystemExit('Unexpected files changed: ' + ', '.join(unexpected))
                    PY

                - name: Commit verified production output
                  shell: bash
                  run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add index.html landing-v11.bootstrap.js landing-v11.bundle.js landing-v11.loader.js package-lock.json

                    if git diff --cached --quiet; then
                      echo "Production output is already current."
                      exit 0
                    fi

                    git commit -m "Build production website bundle"
                    git push origin HEAD:main
          EOF

          rm -f .github/workflows/finalize-production-build.yml
          rm -f .github/finalize-production-build.trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-production.mjs .github/workflows/build-production-bundle.yml
          git add -u .github/workflows/finalize-production-build.yml .github/finalize-production-build.trigger
          git commit -m "Finalize production website build workflow"
          git push origin HEAD:main
