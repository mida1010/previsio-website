name: Diagnose and apply homepage order

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-and-apply-homepage-order.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply or record diagnostic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import traceback

          source = Path('landing-v11.jsx')
          diagnostic = Path('homepage-order-diagnostic.txt')
          try:
              text = source.read_text(encoding='utf-8')
              app = text.index('function App() {')
              start = text.index('      <Hero />', app)
              end = text.index('      <DataPrivacy />', start)
              old_block = text[start:end]
              block = """      <Hero />
      <DashboardPreview />
      <ReportDownload />

      <ModelsPipeline />
      <Features />
      <AnalyticsSection />
      <Methodology />
      <AdvancedCapabilities />
      <PerformanceSnapshot />
      <UseCases />
"""
              output = text[:start] + block + text[end:]
              source.write_text(output, encoding='utf-8')
              diagnostic.write_text(
                  'SUCCESS\nSTART=' + str(start) + '\nEND=' + str(end) + '\nOLD_BLOCK:\n' + old_block,
                  encoding='utf-8'
              )
          except Exception:
              diagnostic.write_text('ERROR\n' + traceback.format_exc(), encoding='utf-8')
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing-v11.jsx homepage-order-diagnostic.txt
          git commit -m "Apply homepage product proof order with diagnostic"
          git push origin main
