name: Apply conditional output publication corrections

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-p0-output-publication.yml

permissions:
  contents: write

jobs:
  apply-change:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct residual output guarantees
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('landing-v11.jsx')
          text = path.read_text(encoding='utf-8')

          replacements = {
              # Analytics section — English
              "['Two probability outputs', 'The probability that the closing price on the target date meets a threshold you set (≥ or ≤), and the probability that it falls within a price range you define — closing, not touch-anytime, probabilities. Both computed from the asset\\'s own error history — not a generic model assumption.']":
              "['Probability outputs, when estimable', 'When requested, the engine estimates the probability that the closing price on the target date meets a threshold you set (≥ or ≤), and the probability that it falls within a price range you define — closing, not touch-anytime, probabilities. Each result is published only when its calibration sample passes the required adequacy and validation checks; otherwise it is explicitly reported as not estimable.']",

              # Analytics section — Italian
              "['Due output probabilistici', 'La probabilità che il prezzo di chiusura alla data obiettivo soddisfi una soglia da voi impostata (≥ oppure ≤), e la probabilità che sia compreso nel range di prezzo definito — probabilità di chiusura, non di tocco. Entrambi calcolati dalla storia degli errori dell\\'asset — non un\\'ipotesi generica.']":
              "['Output probabilistici, quando stimabili', 'Quando richiesto, il motore stima la probabilità che il prezzo di chiusura alla data obiettivo soddisfi una soglia da voi impostata (≥ oppure ≤) e la probabilità che sia compreso nel range di prezzo definito — probabilità di chiusura, non di tocco. Ogni risultato viene pubblicato solo quando il relativo campione di calibrazione supera i controlli di adeguatezza e validazione previsti; in caso contrario è indicato esplicitamente come non stimabile.']",

              # Analytics section — French
              "['Deux sorties probabilistes', 'La probabilité que le prix de clôture à la date cible remplisse un seuil que vous fixez (≥ ou ≤), et la probabilité qu\\'il soit compris dans une fourchette de prix que vous définissez — probabilités de clôture, pas de contact à tout moment. Calculées à partir de l\\'historique d\\'erreurs de l\\'actif — pas une hypothèse générique.']":
              "['Sorties probabilistes, lorsqu’elles sont estimables', 'Lorsqu’elles sont demandées, le moteur estime la probabilité que le prix de clôture à la date cible respecte un seuil défini (≥ ou ≤) et la probabilité qu’il se situe dans une fourchette de prix définie — probabilités de clôture, et non de simple contact. Chaque résultat n’est publié que si son échantillon de calibration satisfait les contrôles d’adéquation et de validation requis ; sinon, il est explicitement indiqué comme non estimable.']",

              # Analytics section — German
              "['Zwei Wahrscheinlichkeitsausgaben', 'Die Wahrscheinlichkeit, dass der Schlusskurs am Zieldatum eine von Ihnen gesetzte Schwelle erfüllt (≥ oder ≤), und die Wahrscheinlichkeit, dass er innerhalb einer von Ihnen definierten Preisspanne liegt — Schlusskurs-, keine Berühr-jederzeit-Wahrscheinlichkeiten. Beide aus der Fehlerhistorie des Assets berechnet — keine generische Modellannahme.']":
              "['Wahrscheinlichkeitsausgaben, sofern schätzbar', 'Auf Anforderung schätzt die Engine die Wahrscheinlichkeit, dass der Schlusskurs am Zieldatum eine festgelegte Schwelle erfüllt (≥ oder ≤), sowie die Wahrscheinlichkeit, dass er innerhalb einer definierten Preisspanne liegt — Schlusskurswahrscheinlichkeiten, keine bloßen Berührungswahrscheinlichkeiten. Jedes Ergebnis wird nur veröffentlicht, wenn die zugehörige Kalibrierungsstichprobe die erforderlichen Eignungs- und Validierungsprüfungen besteht; andernfalls wird es ausdrücklich als nicht schätzbar ausgewiesen.']",

              # Pipeline — English
              "['Build the range', 'Calculate upper and lower bounds from the asset\\'s own forecast errors.']":
              "['Assess the prediction interval', 'Construct upper and lower bounds from the asset’s own forecast errors only when the calibration evidence passes the required adequacy checks; otherwise mark the interval as not estimable.']",
              "['Compute probabilities', 'Two probability outputs: the probability that the closing price on the target date meets the selected threshold condition (≥ or ≤), and the probability that it falls within a price range you define — both with a conservative floor.']":
              "['Assess requested probabilities', 'When requested, estimate threshold and range-closing probabilities from the calibrated forecast-error history. Publish each probability only if its sample and validation gates are sufficient; otherwise report it as not estimable.']",
              "['Bundle the answer', 'All four computed outputs — predicted price, prediction interval, threshold probability, range closing probability — plus diagnostics, compiled into a single results package.']":
              "['Bundle the supported results', 'Compile the point forecast, every interval or probability that passed its publication gates, explicit not-estimable statuses for unsupported requested outputs, and the supporting diagnostics into one results package.']",

              # Pipeline — Italian
              "['Costruire il range', 'Calcolo del limite superiore e inferiore dagli errori di previsione dell\\'asset.']":
              "['Valutare l’intervallo di predizione', 'Costruzione del limite superiore e inferiore dagli errori previsionali dell’asset solo quando l’evidenza di calibrazione supera i controlli di adeguatezza previsti; in caso contrario l’intervallo viene indicato come non stimabile.']",
              "['Calcolare le probabilità', 'Due output probabilistici: la probabilità che il prezzo di chiusura alla data obiettivo soddisfi la condizione di soglia selezionata (≥ oppure ≤), e la probabilità che sia compreso nel range di prezzo definito — entrambi con un floor conservativo.']":
              "['Valutare le probabilità richieste', 'Quando richiesto, il motore stima le probabilità di soglia e di chiusura nel range dalla storia calibrata degli errori previsionali. Ogni probabilità viene pubblicata solo se campione e gate di validazione sono sufficienti; altrimenti viene indicata come non stimabile.']",
              "['Assemblare la risposta', 'Tutti e quattro gli output calcolati — prezzo previsto, intervallo di predizione, probabilità di soglia, probabilità di chiusura nel range — più diagnostica, compilati in un unico pacchetto di risultati.']":
              "['Assemblare i risultati supportati', 'Il pacchetto finale comprende il forecast puntuale, gli intervalli e le probabilità che hanno superato i rispettivi gate di pubblicazione, lo stato esplicito di non stimabilità per gli output richiesti ma non supportati e la diagnostica di calcolo.']",

              # Pipeline — French
              "['Construire la fourchette', 'Calcul des bornes haute et basse à partir des erreurs de prévision de l\\'actif.']":
              "['Évaluer l’intervalle de prédiction', 'Construction des bornes haute et basse à partir des erreurs de prévision de l’actif uniquement lorsque les éléments de calibration satisfont les contrôles d’adéquation requis ; sinon, l’intervalle est indiqué comme non estimable.']",
              "['Calculer les probabilités', 'Deux sorties probabilistes : la probabilité que le prix de clôture à la date cible remplisse la condition de seuil sélectionnée (≥ ou ≤), et la probabilité qu\\'il soit compris dans la fourchette définie — avec un plancher conservateur.']":
              "['Évaluer les probabilités demandées', 'Lorsqu’elles sont demandées, le moteur estime les probabilités de seuil et de clôture dans la fourchette à partir de l’historique calibré des erreurs de prévision. Chaque probabilité n’est publiée que si son échantillon et ses seuils de validation sont suffisants ; sinon, elle est indiquée comme non estimable.']",
              "['Assembler la réponse', 'Les quatre résultats calculés — prix prévu, intervalle de prédiction, probabilité de seuil, probabilité de clôture dans la fourchette — plus diagnostics, compilés en un seul package de résultats.']":
              "['Assembler les résultats étayés', 'Le package final comprend la prévision ponctuelle, les intervalles et probabilités ayant franchi leurs seuils de publication, un statut explicite non estimable pour les sorties demandées mais insuffisamment étayées, ainsi que les diagnostics de calcul.']",

              # Pipeline — German
              "['Spanne berechnen', 'Berechnung von Ober- und Untergrenzen aus den Prognosefehlern des Assets.']":
              "['Prognoseintervall bewerten', 'Ober- und Untergrenzen werden nur dann aus den Prognosefehlern des Assets konstruiert, wenn die Kalibrierungsgrundlage die erforderlichen Eignungsprüfungen besteht; andernfalls wird das Intervall als nicht schätzbar ausgewiesen.']",
              "['Wahrscheinlichkeiten berechnen', 'Zwei Wahrscheinlichkeitsausgaben: die Wahrscheinlichkeit, dass der Schlusskurs am Zieldatum die gewählte Schwellenbedingung erfüllt (≥ oder ≤), und die Wahrscheinlichkeit, dass er innerhalb der definierten Preisspanne liegt — beide mit konservativem Minimum.']":
              "['Angeforderte Wahrscheinlichkeiten bewerten', 'Auf Anforderung schätzt die Engine Schwellen- und Spannenwahrscheinlichkeiten aus der kalibrierten Historie der Prognosefehler. Jede Wahrscheinlichkeit wird nur veröffentlicht, wenn Stichprobe und Validierungsschwellen ausreichend sind; andernfalls wird sie als nicht schätzbar ausgewiesen.']",
              "['Antwort bündeln', 'Alle vier berechneten Ausgaben — Prognospreis, Prognoseintervall, Schwellenwahrscheinlichkeit, Schließen-Wahrscheinlichkeit in der Spanne — plus Diagnostik, in einem Ergebnispaket zusammengefasst.']":
              "['Gestützte Ergebnisse bündeln', 'Das Ergebnispaket enthält die Punktprognose, alle Intervalle und Wahrscheinlichkeiten, die ihre Veröffentlichungsschwellen bestanden haben, ausdrückliche Nicht-schätzbar-Status für angeforderte, aber nicht ausreichend gestützte Ausgaben sowie die Berechnungsdiagnostik.']",
          }

          failures = []
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  failures.append(f'expected 1 occurrence, found {count}: {old[:100]}')
              else:
                  text = text.replace(old, new)

          if failures:
              raise SystemExit('\n'.join(failures))

          banned = [
              'All four computed outputs',
              'Tutti e quattro gli output calcolati',
              'Les quatre résultats calculés',
              'Alle vier berechneten Ausgaben',
              "['Two probability outputs'",
              "['Due output probabilistici'",
              "['Deux sorties probabilistes'",
              "['Zwei Wahrscheinlichkeitsausgaben'",
          ]
          remaining = [phrase for phrase in banned if phrase in text]
          if remaining:
              raise SystemExit('Residual unconditional output claims: ' + ', '.join(remaining))

          # Guardrail: validation data and its comment must remain untouched.
          required_validation_markers = [
              'Real data — extracted directly from the backtest_statistics workbook',
              "'1D': { random: { mape: '1.32%'",
              "'1Y': { random: { mape: '24.18%'",
              "'3Y': { random: { mape: '25.63%'",
          ]
          missing_validation = [marker for marker in required_validation_markers if marker not in text]
          if missing_validation:
              raise SystemExit('Validation section changed unexpectedly: ' + ', '.join(missing_validation))

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-p0-output-publication.yml').unlink()
          PY

      - name: Validate JavaScript source invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('landing-v11.jsx').read_text(encoding='utf-8')
          required = [
              'Output probabilistici, quando stimabili',
              'Assemblare i risultati supportati',
              'explicit not-estimable statuses',
              'non estimable',
              'nicht schätzbar',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing corrected copy: ' + ', '.join(missing))
          PY

      - name: Commit correction to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing-v11.jsx .github/workflows/fix-p0-output-publication.yml
          git commit -m "Clarify conditional publication of outputs"
          git push origin HEAD:main
