name: Clean temporary production build files

on:
  push:
    branches:
      - main
    paths:
      - .github/cleanup-production-build.trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary runner and triggers
        shell: bash
        run: |
          rm -f .github/workflows/run-production-build.yml
          rm -f .github/workflows/cleanup-production-build.yml
          rm -f .github/production-build.trigger
          rm -f .github/cleanup-production-build.trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Remove temporary production build runner"
          git push origin HEAD:main
