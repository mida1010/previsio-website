name: Finalize requested P1 and P2 changes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-p1-p2-alignment.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested website changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          landing_path = Path('landing-v11.jsx')
          privacy_path = Path('privacy.html')
          eula_path = Path('eula.html')

          landing = landing_path.read_text(encoding='utf-8')
          privacy = privacy_path.read_text(encoding='utf-8')
          eula = eula_path.read_text(encoding='utf-8')

          validation_start = 'function PerformanceSnapshot() {'
          validation_end = 'const PX_DOCS_URL ='
          validation_before = landing.split(validation_start, 1)[1].split(validation_end, 1)[0]

          def replace_between(text, start, end, replacement, label):
              if start not in text:
                  raise SystemExit(f'{label}: start marker missing')
              tail = text.index(start)
              if end not in text[tail:]:
                  raise SystemExit(f'{label}: end marker missing')
              head = text.index(end, tail)
              return text[:tail] + replacement + text[head:]

          def replace_line_containing(text, token, new_line, label):
              lines = text.splitlines()
              matches = [i for i, line in enumerate(lines) if token in line]
              if len(matches) != 1:
                  raise SystemExit(f'{label}: expected one line, found {len(matches)}')
              lines[matches[0]] = new_line
              return '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          # P1.3: only claim the CSV/XLSX layouts accepted by the real importer.
          import_copy = {
              "    data_card3_title: 'Compatible with any provider',": "    data_card3_title: 'Documented CSV and XLSX imports',",
              "    data_card3_body: 'Bloomberg Excel, Refinitiv CSV, FactSet exports, internal databases: if it has a date column and a price column, Previsio reads it. Change provider at any time without modifying the system.',": "    data_card3_body: 'Previsio imports CSV and XLSX files exported from Bloomberg, Refinitiv, FactSet and internal databases when they match one of the documented layouts: Bloomberg wide, simple long (Date, Ticker, Close), simple wide, or Bloomberg paired blocks. Unsupported layouts are rejected rather than interpreted as valid data.',",
              "    data_card3_title: 'Compatibile con qualsiasi provider',": "    data_card3_title: 'Import CSV e XLSX documentati',",
              "    data_card3_body: 'Excel Bloomberg, CSV Refinitiv, export FactSet, database interni: se ha una colonna data e una colonna prezzo, Previsio lo legge. Cambiate provider in qualsiasi momento senza modificare il sistema.',": "    data_card3_body: 'Previsio importa file CSV e XLSX esportati da Bloomberg, Refinitiv, FactSet e database interni quando rispettano uno dei layout documentati: Bloomberg wide, simple long (Date, Ticker, Close), simple wide o Bloomberg paired blocks. I layout non supportati vengono rifiutati anziché interpretati come dati validi.',",
              "    data_card3_title: 'Compatible avec tout fournisseur',": "    data_card3_title: 'Imports CSV et XLSX documentés',",
              "    data_card3_body: 'Excel Bloomberg, CSV Refinitiv, exports FactSet, bases de données internes: s\\'il y a une colonne date et une colonne prix, Previsio le lit. Changez de fournisseur à tout moment sans modifier le système.',": "    data_card3_body: 'Previsio importe les fichiers CSV et XLSX exportés depuis Bloomberg, Refinitiv, FactSet et des bases de données internes lorsqu’ils respectent l’un des formats documentés : Bloomberg wide, simple long (Date, Ticker, Close), simple wide ou Bloomberg paired blocks. Les formats non pris en charge sont rejetés plutôt qu’interprétés comme des données valides.',",
              "    data_card3_title: 'Kompatibel mit jedem Anbieter',": "    data_card3_title: 'Dokumentierte CSV- und XLSX-Importe',",
              "    data_card3_body: 'Bloomberg Excel, Refinitiv CSV, FactSet-Exporte, interne Datenbanken: wenn es eine Datumsspalte und eine Preisspalte hat, liest Previsio es. Wechseln Sie den Anbieter jederzeit, ohne das System anzupassen.',": "    data_card3_body: 'Previsio importiert CSV- und XLSX-Dateien aus Bloomberg, Refinitiv, FactSet und internen Datenbanken, wenn sie einem der dokumentierten Layouts entsprechen: Bloomberg wide, simple long (Date, Ticker, Close), simple wide oder Bloomberg paired blocks. Nicht unterstützte Layouts werden abgelehnt, statt als gültige Daten interpretiert zu werden.',",
          }
          for old, new in import_copy.items():
              if old not in landing:
                  raise SystemExit(f'import copy missing: {old[:55]}')
              landing = landing.replace(old, new, 1)
          landing = landing.replace("['BLOOMBERG', 'REFINITIV', 'FACTSET', 'CSV / XLSX', 'OTHER']", "['BLOOMBERG', 'REFINITIV', 'FACTSET', 'CSV / XLSX', 'INTERNAL DATABASE EXPORTS']", 1)

          # P1.2: Store product is local-Ollama only. Remove all marketed cloud-AI options.
          feature_copy = {
              "    ['Your data, your source, your control', 'In the standard configuration, market files, quantitative calculations and the Ollama-generated commentary are processed locally. If a cloud configuration is requested, the related data flow is defined and documented separately.'],": "    ['Your data, your source, your control', 'In the Microsoft Store desktop version, market files, quantitative calculations and Ollama-generated commentary are processed locally on the client device. External cloud AI providers and remote LLM endpoints are not supported by the standard product.'],",
              "    ['I vostri dati, la vostra fonte, il vostro controllo', 'Nella configurazione standard, i file di mercato, i calcoli quantitativi e il commento generato tramite Ollama vengono elaborati localmente. Qualora venga richiesta una configurazione cloud, il relativo flusso dati viene definito e documentato separatamente.'],": "    ['I vostri dati, la vostra fonte, il vostro controllo', 'Nella versione desktop distribuita tramite Microsoft Store, file di mercato, calcoli quantitativi e commento generato tramite Ollama vengono elaborati localmente sul dispositivo del cliente. Provider AI cloud esterni ed endpoint LLM remoti non sono supportati dal prodotto standard.'],",
              "    ['Vos données, votre source, votre contrôle', 'Dans la configuration standard, les fichiers de marché, les calculs quantitatifs et le commentaire généré via Ollama sont traités localement. Si une configuration cloud est demandée, le flux de données correspondant est défini et documenté séparément.'],": "    ['Vos données, votre source, votre contrôle', 'Dans la version desktop distribuée via Microsoft Store, les fichiers de marché, les calculs quantitatifs et le commentaire généré via Ollama sont traités localement sur l’appareil du client. Les fournisseurs d’IA cloud externes et les endpoints LLM distants ne sont pas pris en charge par le produit standard.'],",
              "    ['Ihre Daten, Ihre Quelle, Ihre Kontrolle', 'In der Standardkonfiguration werden Marktdateien, quantitative Berechnungen und der über Ollama erzeugte Kommentar lokal verarbeitet. Wird eine Cloud-Konfiguration angefragt, wird der entsprechende Datenfluss separat definiert und dokumentiert.'],": "    ['Ihre Daten, Ihre Quelle, Ihre Kontrolle', 'In der über den Microsoft Store vertriebenen Desktopversion werden Marktdateien, quantitative Berechnungen und der über Ollama erzeugte Kommentar lokal auf dem Gerät des Kunden verarbeitet. Externe Cloud-KI-Anbieter und entfernte LLM-Endpunkte werden vom Standardprodukt nicht unterstützt.'],",
          }
          for old, new in feature_copy.items():
              if old not in landing:
                  raise SystemExit(f'feature local-only copy missing: {old[:55]}')
              landing = landing.replace(old, new, 1)

          pricing_lines = {
              "en: 'Local configuration via Ollama is the standard mode.": "              en: 'The Microsoft Store desktop version uses only Ollama running locally on the client device. External cloud AI providers, remote LLM endpoints and dedicated cloud infrastructure are not part of the standard product or licence. Any future enterprise deployment would require a separate, explicitly documented technical and contractual project.',",
              "it: 'La configurazione locale tramite Ollama è la modalità standard.": "              it: 'La versione desktop distribuita tramite Microsoft Store utilizza esclusivamente Ollama in esecuzione locale sul dispositivo del cliente. Provider AI cloud esterni, endpoint LLM remoti e infrastrutture cloud dedicate non fanno parte del prodotto o della licenza standard. Qualsiasi futuro deployment enterprise richiederebbe un progetto tecnico e contrattuale separato ed esplicitamente documentato.',",
              "fr: 'La configuration locale via Ollama est le mode standard.": "              fr: 'La version desktop distribuée via Microsoft Store utilise exclusivement Ollama exécuté localement sur l’appareil du client. Les fournisseurs d’IA cloud externes, les endpoints LLM distants et les infrastructures cloud dédiées ne font pas partie du produit ni de la licence standard. Tout futur déploiement enterprise nécessiterait un projet technique et contractuel séparé et explicitement documenté.',",
              "de: 'Die lokale Konfiguration über Ollama ist der Standardmodus.": "              de: 'Die über den Microsoft Store vertriebene Desktopversion verwendet ausschließlich Ollama lokal auf dem Gerät des Kunden. Externe Cloud-KI-Anbieter, entfernte LLM-Endpunkte und dedizierte Cloud-Infrastruktur sind nicht Bestandteil des Standardprodukts oder der Standardlizenz. Jede künftige Enterprise-Bereitstellung würde ein separates, ausdrücklich dokumentiertes technisches und vertragliches Projekt erfordern.'",
          }
          for token, line in pricing_lines.items():
              landing = replace_line_containing(landing, token, line, token[:2] + ' pricing')

          landing = replace_line_containing(
              landing,
              "Any optional cloud services use only the content and data flows agreed before activation.",
              "    d: { en: 'Encrypted authentication with credentials kept out of every log. In the Microsoft Store desktop version, datasets, quantitative results, reports and narrative commentary remain within the client’s local environment. Only the minimum technical data required for licence activation may leave the calculation perimeter.', it: 'Autenticazione cifrata con credenziali escluse da ogni log. Nella versione desktop distribuita tramite Microsoft Store, dataset, risultati quantitativi, report e commento narrativo rimangono nell’ambiente locale del cliente. Solo i dati tecnici minimi necessari all’attivazione della licenza possono uscire dal perimetro di calcolo.', fr: 'Authentification chiffrée avec identifiants exclus de tous les journaux. Dans la version desktop distribuée via Microsoft Store, les jeux de données, résultats quantitatifs, rapports et commentaires narratifs restent dans l’environnement local du client. Seules les données techniques minimales nécessaires à l’activation de la licence peuvent quitter le périmètre de calcul.', de: 'Verschlüsselte Authentifizierung, wobei Anmeldedaten aus allen Protokollen ausgeschlossen bleiben. In der über den Microsoft Store vertriebenen Desktopversion verbleiben Datensätze, quantitative Ergebnisse, Berichte und narrative Kommentare in der lokalen Umgebung des Kunden. Nur die für die Lizenzaktivierung erforderlichen minimalen technischen Daten dürfen den Berechnungsperimeter verlassen.' } },",
              'trust local perimeter',
          )

          landing = landing.replace('AI PROCESSING — local Ollama disclosure + optional cloud config', 'AI PROCESSING — local Ollama disclosure', 1)
          cloud_object_start = '  const cloud = {'
          cloud_object_end = '\n\n  const itemGrid ='
          if cloud_object_start not in landing or cloud_object_end not in landing:
              raise SystemExit('cloud AI object boundaries missing')
          i = landing.index(cloud_object_start)
          j = landing.index(cloud_object_end, i)
          landing = landing[:i] + landing[j + 2:]

          cloud_card_start = '        <div className="card" style={{ maxWidth: 980, margin: \'28px auto 0\''
          cloud_card_end = '\n\n        <style>'
          if cloud_card_start not in landing or cloud_card_end not in landing:
              raise SystemExit('cloud AI card boundaries missing')
          i = landing.index(cloud_card_start)
          j = landing.index(cloud_card_end, i)
          landing = landing[:i] + landing[j:]

          # P2.5: remove third-party AI logos/names from founder positioning.
          founder_start = '                    <div className="about-ai-header" style={{ flexWrap: \'wrap\', gap: \'6px 16px\' }}>'
          founder_end = '                    <div className="about-ai-role"'
          if founder_start not in landing or founder_end not in landing:
              raise SystemExit('founder AI block boundaries missing')
          i = landing.index(founder_start)
          j = landing.index(founder_end, i)
          founder_header = """                    <div className="about-ai-header" style={{ display: 'block' }}>
                      <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <span className="about-ai-dot" style={{ background: '#D4AF37', boxShadow: '0 0 8px rgba(212,175,55,0.55)' }}></span>
                        <span className="about-ai-name">
                          {{ en: 'AI-assisted engineering under human control', it: 'Ingegneria assistita da AI sotto controllo umano', fr: 'Ingénierie assistée par IA sous contrôle humain', de: 'KI-gestütztes Engineering unter menschlicher Kontrolle' }[lang]}
                        </span>
                      </span>
                    </div>
"""
          landing = landing[:i] + founder_header + landing[j:]
          old_role = "                      {'AI-ASSISTED ENGINEERING · HUMAN VALIDATION · NO AI-GENERATED NUMBERS'}"
          new_role = "                      {{ en: 'QUANTITATIVE ENGINE · HUMAN VALIDATION · NO AI-GENERATED NUMBERS', it: 'MOTORE QUANTITATIVO · VALIDAZIONE UMANA · NESSUN NUMERO GENERATO DALL’AI', fr: 'MOTEUR QUANTITATIF · VALIDATION HUMAINE · AUCUN CHIFFRE GÉNÉRÉ PAR L’IA', de: 'QUANTITATIVE ENGINE · MENSCHLICHE VALIDIERUNG · KEINE KI-GENERIERTEN ZAHLEN' }[lang]}"
          if old_role not in landing:
              raise SystemExit('founder role line missing')
          landing = landing.replace(old_role, new_role, 1)

          # P2.8: show actual interface and sample report directly after the hero.
          app_start = '      <Hero />'
          app_end = '      <DataPrivacy />'
          i = landing.index(app_start)
          j = landing.index(app_end, i)
          new_order = """      <Hero />
      <DashboardPreview />
      <ReportDownload />

      <ModelsPipeline />
      <Features />
      <AnalyticsSection />
      <Methodology />
      <AdvancedCapabilities />
      <PerformanceSnapshot />
      <UseCases />
"""
          landing = landing[:i] + new_order + landing[j:]

          # Privacy: standard Store product cannot send content to remote LLM providers.
          en_start = '  <h2>9. Optional AI/LLM services</h2>'
          en_end = '  <h2>10. Optional Telegram delivery</h2>'
          en_replacement = """  <h2>9. Local AI commentary</h2>
  <p>
    The Microsoft Store desktop version may generate narrative commentary through Ollama running
    locally on the User's device. Market datasets, quantitative results and report content used by
    this function are not sent to external AI providers. Remote LLM endpoints and third-party cloud
    AI providers are not supported by the standard Microsoft Store product.
  </p>
  <p>
    The language model produces qualitative narrative commentary only. Forecasts, probabilities,
    metrics, formulas and all other numerical results are calculated by the Software's quantitative
    engine before the commentary stage.
  </p>

"""
          privacy = replace_between(privacy, en_start, en_end, en_replacement, 'English privacy AI section')

          it_start = '  <h2>9. Servizi opzionali di intelligenza artificiale (AI/LLM)</h2>'
          it_end = '  <h2>10. Consegna opzionale tramite Telegram</h2>'
          it_replacement = """  <h2>9. Commento AI locale</h2>
  <p>
    La versione desktop distribuita tramite Microsoft Store può generare commenti narrativi tramite
    Ollama in esecuzione locale sul dispositivo dell'Utente. I dataset di mercato, i risultati
    quantitativi e i contenuti del report utilizzati da questa funzione non vengono inviati a provider
    AI esterni. Endpoint LLM remoti e provider AI cloud di terze parti non sono supportati dal prodotto
    standard distribuito tramite Microsoft Store.
  </p>
  <p>
    Il modello linguistico produce esclusivamente commenti narrativi qualitativi. Forecast,
    probabilità, metriche, formule e ogni altro risultato numerico sono calcolati dal motore
    quantitativo del Software prima della fase di commento.
  </p>

"""
          privacy = replace_between(privacy, it_start, it_end, it_replacement, 'Italian privacy AI section')
          privacy = privacy.replace('API keys for optional LLM/cloud services', 'credentials required by supported optional features')
          privacy = privacy.replace('chiavi API per servizi LLM/cloud opzionali', 'credenziali richieste dalle funzionalità opzionali supportate')
          privacy = privacy.replace('cloud LLMs, Telegram, etc.', 'Telegram and other supported third-party delivery services')
          privacy = privacy.replace('LLM cloud, Telegram, ecc.', 'Telegram e altri servizi di consegna di terze parti supportati')
          privacy = privacy.replace('cloud LLMs,\n    Telegram, etc.', 'Telegram and other supported third-party delivery services')
          privacy = privacy.replace('LLM cloud,\n    Telegram, ecc.', 'Telegram e altri servizi di consegna di terze parti supportati')

          # EULA: remove the contractual suggestion that users can configure cloud LLMs.
          eula = eula.replace(
              "Certain optional features may integrate\n    with third-party services (for example a local language model or, if\n    configured by the User, a cloud service); in such cases the relevant\n    provider's terms apply, and the User undertakes to comply with them.",
              "Certain optional features may integrate with supported third-party delivery\n    services. Narrative AI commentary in the Microsoft Store desktop version uses a local\n    Ollama model only; remote LLM endpoints and cloud AI providers are not supported by the\n    standard product. Where a supported third-party delivery service is configured, the\n    relevant provider's terms apply and the User undertakes to comply with them."
          )
          eula = eula.replace(
              "Alcune funzionalità opzionali possono integrarsi con servizi di terze parti (ad esempio un modello linguistico locale o, se configurato dall'Utente, un servizio cloud); in tali casi si applicano le condizioni del relativo fornitore e l'Utente si impegna a rispettarle.",
              "Alcune funzionalità opzionali possono integrarsi con servizi di consegna di terze parti supportati. Nella versione desktop distribuita tramite Microsoft Store, il commento AI utilizza esclusivamente un modello Ollama locale; endpoint LLM remoti e provider AI cloud non sono supportati dal prodotto standard. Quando viene configurato un servizio di consegna di terze parti supportato, si applicano le condizioni del relativo fornitore e l'Utente si impegna a rispettarle."
          )

          validation_after = landing.split(validation_start, 1)[1].split(validation_end, 1)[0]
          if validation_after != validation_before:
              raise SystemExit('Validation section changed unexpectedly')

          forbidden = [
              'Compatible with any provider', 'Compatibile con qualsiasi provider',
              'Compatible avec tout fournisseur', 'Kompatibel mit jedem Anbieter',
              "{ name: 'Claude'", "{ name: 'ChatGPT'", "{ name: 'Grok'", "{ name: 'Gemini'",
              'Cloud AI provider chosen by the client.', 'Provider AI cloud scelto dal cliente.',
              'If a cloud configuration is requested', 'Qualora venga richiesta una configurazione cloud',
          ]
          for token in forbidden:
              if token in landing:
                  raise SystemExit(f'legacy copy remains: {token}')

          required = [
              'Documented CSV and XLSX imports', 'Import CSV e XLSX documentati',
              'The Microsoft Store desktop version uses only Ollama',
              'AI-assisted engineering under human control',
              '<Hero />\n      <DashboardPreview />\n      <ReportDownload />',
          ]
          for token in required:
              if token not in landing:
                  raise SystemExit(f'required copy missing: {token}')

          landing_path.write_text(landing, encoding='utf-8')
          privacy_path.write_text(privacy, encoding='utf-8')
          eula_path.write_text(eula, encoding='utf-8')
          PY

      - name: Commit and clean one-time workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-p1-p2-marketing-alignment.yml
          rm -f .github/workflows/apply-p1-p2-marketing-alignment-v2.yml
          rm -f .github/workflows/finalize-p1-p2-alignment.yml
          git add -A
          git diff --cached --check
          git commit -m "Apply requested P1 and P2 website changes"
          git push origin main
