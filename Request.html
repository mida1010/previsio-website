<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Previsio — Request Access</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<meta name="ext-resource-dependency" content="logo-arrow.png" data-resource-id="logoArrow" />

<style>
  :root {
    --bg-deep: #050505;
    --bg-soft: #0a0a0c;
    --bg-panel: rgba(20, 20, 23, 0.70);
    --bg-card: rgba(255, 255, 255, 0.025);
    --gold-primary: #D4AF37;
    --gold-light: #F3E5AB;
    --gold-dim: #8a7024;
    --gold-deep: #5e4b16;
    --gold-glow: rgba(212, 175, 55, 0.3);
    --text-main: #EAEAEA;
    --text-muted: #888888;
    --text-faint: #555;
    --text-gold: #D4AF37;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --border-gold: rgba(212, 175, 55, 0.25);
    --glass-blur: blur(20px);
    --shadow-luxury: 0 20px 50px rgba(0,0,0,0.7);
    --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    line-height: 1.55;
    min-height: 100vh;
  }

  .ambient-bg {
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 12% 8%, rgba(212,175,55,0.06), transparent 38%),
      radial-gradient(circle at 88% 18%, rgba(50,60,90,0.10), transparent 40%),
      radial-gradient(circle at 50% 110%, rgba(212,175,55,0.05), transparent 45%);
    z-index: -2; pointer-events: none;
  }
  .ambient-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 64px 64px;
    z-index: -1; pointer-events: none;
    mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);
  }

  /* Nav */
  .nav {
    position: sticky; top: 0; z-index: 80;
    background: rgba(5,5,5,0.72);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0;
    width: min(1280px, 100% - 48px); margin: 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .nav-logo { height: 36px; width: auto; display: block; transition: opacity 0.2s ease; }
  .brand:hover .nav-logo { opacity: 0.82; }
  .nav-links { display: flex; align-items: center; gap: 16px; }
  .lang-selector { display: flex; gap: 6px; }
  .lang-btn {
    background: transparent; border: 1px solid rgba(212,175,55,0.3);
    color: var(--text-muted); padding: 6px 10px; font-size: 11px; font-weight: 600;
    cursor: pointer; border-radius: 4px; transition: all 0.2s ease;
  }
  .lang-btn:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
  .lang-btn.active { background: var(--gold-primary); border-color: var(--gold-primary); color: var(--bg-deep); }

  /* Container */
  .container { width: min(1280px, 100% - 48px); margin: 0 auto; }

  /* Page layout */
  .page-header {
    text-align: center;
    padding: clamp(60px, 8vw, 100px) 0 40px;
  }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
    text-decoration: none; letter-spacing: 0.1em; text-transform: uppercase;
    transition: color 0.2s ease; margin-bottom: 28px;
  }
  .back-link:hover { color: var(--gold-primary); }
  .page-title {
    font-family: var(--font-ui); font-weight: 300; font-size: clamp(28px, 4vw, 44px);
    letter-spacing: -0.02em; line-height: 1.1; color: var(--text-main);
    margin: 0 0 12px; text-wrap: balance;
  }
  .page-title em { font-style: italic; font-weight: 200; color: var(--gold-light); }
  .page-sub {
    color: var(--text-muted); font-size: 15px; font-weight: 300; line-height: 1.6;
    max-width: 52ch; margin: 0 auto; text-wrap: pretty;
  }

  /* Tab switcher */
  .form-tabs {
    display: flex; justify-content: center; gap: 4px;
    margin: 32px auto 0; padding: 4px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm); width: fit-content;
  }
  .form-tab {
    background: transparent; border: none; cursor: pointer;
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-muted); padding: 10px 22px;
    border-radius: 6px; transition: all 0.25s ease;
  }
  .form-tab:hover { color: var(--text-main); }
  .form-tab.active {
    background: rgba(212,175,55,0.12); color: var(--gold-primary);
    border: 1px solid rgba(212,175,55,0.25);
  }

  /* Form area */
  .form-area { padding: 48px 0 clamp(80px, 9vw, 140px); }
  .form-wrapper { max-width: 520px; margin: 0 auto; }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-luxury);
    padding: 28px;
  }

  .form-section-title {
    font-family: var(--font-mono); font-size: 10px; color: var(--gold-primary);
    letter-spacing: 0.2em; text-transform: uppercase; margin: 0 0 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .form-section-title::after {
    content: ''; flex: 1; height: 1px; background: rgba(212,175,55,0.15);
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-family: var(--font-mono); font-size: 9px; color: var(--gold-light);
    letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 6px;
  }
  .field input, .field textarea {
    width: 100%; margin-top: 0;
    padding: 10px 12px;
    background: rgba(0,0,0,0.4); border: 1px solid var(--border-subtle);
    border-radius: 6px; color: var(--text-main);
    font-family: var(--font-ui); font-size: 13px; font-weight: 300;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .field input:focus, .field textarea:focus {
    border-color: var(--gold-dim); box-shadow: 0 0 12px rgba(212,175,55,0.12); outline: none;
  }
  .field input::placeholder, .field textarea::placeholder {
    color: var(--text-faint);
  }

  .info-box {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px;
    background: rgba(212,175,55,0.04); border: 1px solid rgba(212,175,55,0.15);
    border-radius: var(--radius-sm); margin-bottom: 20px;
  }
  .info-box-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .info-box-text {
    font-family: var(--font-mono); font-size: 10px; color: var(--gold-light);
    letter-spacing: 0.06em; line-height: 1.6;
  }

  /* Badges */
  .badges {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
  }
  .badge {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; padding: 5px 14px;
    border-radius: var(--radius-sm);
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 24px; border-radius: var(--radius-sm);
    font-family: var(--font-ui); font-weight: 600; font-size: 13px;
    letter-spacing: 0.08em; text-decoration: none; cursor: pointer;
    transition: all 0.25s ease; border: 1px solid transparent; white-space: nowrap;
  }
  .btn-gold {
    background: linear-gradient(135deg, var(--gold-dim), var(--gold-deep));
    border-color: var(--gold-primary); color: #fff;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .btn-gold:hover {
    filter: brightness(1.15); transform: translateY(-1px);
    box-shadow: 0 8px 28px rgba(212,175,55,0.22), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .btn-gold:disabled { opacity: 0.5; pointer-events: none; }
  .btn .arrow { transition: transform 0.2s ease; }
  .btn:hover .arrow { transform: translateX(3px); }

  .form-footer {
    font-family: var(--font-mono); font-size: 9px; color: var(--text-faint);
    letter-spacing: 0.12em; text-transform: uppercase; text-align: center; margin-top: 14px;
  }

  /* Success state */
  .success-state {
    text-align: center; padding: 48px 28px;
  }
  .success-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(212,175,55,0.08); border: 1px solid rgba(212,175,55,0.25);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px; font-size: 24px; color: var(--gold-primary);
  }
  .success-msg {
    font-size: 15px; color: var(--gold-primary); margin: 0 0 10px; font-weight: 500;
  }
  .success-sub {
    font-size: 13px; color: var(--text-muted); font-weight: 300; margin: 0;
  }

  /* Footer */
  .page-footer {
    border-top: 1px solid var(--border-subtle);
    padding: 32px 0; text-align: center;
  }
  .page-footer a {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
    text-decoration: none; letter-spacing: 0.1em;
    transition: color 0.2s ease;
  }
  .page-footer a:hover { color: var(--gold-primary); }

  /* Doc description */
  .doc-desc {
    font-size: 13px; color: var(--text-muted); line-height: 1.6;
    margin-bottom: 20px; text-wrap: pretty;
  }
  .doc-specs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 20px; padding: 14px;
    background: rgba(0,0,0,0.3); border: 1px solid var(--border-subtle);
    border-radius: 6px;
  }
  .doc-spec-label {
    font-family: var(--font-mono); font-size: 9px; color: var(--text-muted);
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .doc-spec-val {
    font-family: var(--font-mono); font-size: 12px; color: var(--gold-light); margin-top: 3px;
  }

  @media (max-width: 640px) {
    .nav-logo { height: 28px; }
    .form-tabs { flex-direction: column; width: 100%; }
    .form-tab { text-align: center; }
    .doc-specs { grid-template-columns: 1fr; }
  }

  /* ── Setup notice ── */
  .setup-notice {
    background: rgba(212,175,55,0.05);
    border: 1px solid rgba(212,175,55,0.28);
    border-radius: var(--radius-md);
    padding: 18px 22px;
    margin: 24px auto;
    max-width: 560px;
    display: flex; align-items: flex-start; gap: 16px;
  }
  .setup-notice-icon { font-size: 22px; flex-shrink: 0; line-height: 1; margin-top: 1px; }
  .setup-notice-title {
    font-family: var(--font-mono); font-size: 10px; color: var(--gold-primary);
    letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; margin-bottom: 8px;
  }
  .setup-notice-text {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted);
    line-height: 1.7; letter-spacing: 0.02em;
  }
  .setup-notice-steps {
    margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 5px;
  }
  .setup-notice-steps li {
    display: flex; gap: 8px;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
  }
  .setup-notice-steps li::before { content: '›'; color: var(--gold-primary); flex-shrink: 0; }
  .setup-notice code {
    background: rgba(0,0,0,0.5); border: 1px solid var(--border-subtle);
    border-radius: 3px; padding: 1px 6px; color: var(--gold-light); font-size: 10px;
    font-family: var(--font-mono);
  }
  .setup-notice-free {
    margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(212,175,55,0.12);
    font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); letter-spacing: 0.08em;
  }

  /* ── Inline field error ── */
  .field-error-inline {
    font-family: var(--font-mono); font-size: 9px; color: #e88080;
    letter-spacing: 0.04em; margin-left: 6px; font-style: italic;
  }
</style>
</head>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ─── Language ─── */
const LANGS = ['en','it','fr','de'];
const LANG_LABELS = { en: 'EN', it: 'IT', fr: 'FR', de: 'DE' };

function useLang() {
  /* Shared with index.html — 'previsioLang' is the legacy key kept as a read fallback. */
  const [lang, setLang] = useState(() => {
    try { const s = localStorage.getItem('previsio_lang') || localStorage.getItem('previsioLang'); return LANGS.includes(s) ? s : 'en'; }
    catch { return 'en'; }
  });
  useEffect(() => {
    try { localStorage.setItem('previsio_lang', lang); localStorage.setItem('previsioLang', lang); } catch {}
    document.documentElement.lang = lang;
  }, [lang]);
  return { lang, setLang };
}

  /* ── Quote form ── */

/* ─── Formspree endpoints ──────────────────────────────────────────────
   HOW TO ACTIVATE:
   1. Go to formspree.io → sign up free
   2. Create two forms: "Previsio Docs" and "Previsio Trial"
   3. Copy each Form ID (e.g. xpzvwgkn) and paste below
   Free tier: 50 submissions / month per form · email notifications included
   ──────────────────────────────────────────────────────────────────────── */
const FORMSPREE_DOCS_ID  = 'mojzyddk';        // ✓ Previsio Docs
const FORMSPREE_TRIAL_ID = 'mvzndary';        // ✓ Previsio Trial
const FORMSPREE_QUOTE_ID = 'mvzndary';        // reuses Trial inbox — flagged as [Quote] in the subject line

/* ─── Telegram notification (optional, runs in parallel with the email) ──
   The Formspree email (Gmail) is sent by Formspree. To ALSO get a Telegram
   message on every request, paste your bot token and chat id below.
   Leave either blank to disable Telegram (the form still works and the
   Gmail notification is unaffected).

   How to get them:
   1. Open @BotFather on Telegram → /newbot → copy the token (e.g. 123456:ABC…)
   2. Open @userinfobot (or your group) → copy the chat id (e.g. 987654321)

   ⚠ SECURITY: a bot token placed in client-side code is visible to anyone
   who views the page source. For production prefer a small server-side
   relay; if you use a client token, keep the bot locked down and rotate it
   immediately if it leaks.
   ──────────────────────────────────────────────────────────────────────── */
const TELEGRAM_BOT_TOKEN = '';   // e.g. '123456789:AAH...'  ← paste here
const TELEGRAM_CHAT_ID   = '';   // e.g. '987654321'          ← paste here

async function notifyTelegram(text) {
  if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;   // disabled until configured
  try {
    await fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: TELEGRAM_CHAT_ID,
        text: text,
        disable_web_page_preview: true,
      }),
    });
  } catch (e) {
    /* Never block the form (or the Gmail notification) on a Telegram error. */
  }
}

function c(key, lang) {
  const entry = COPY[key];
  if (!entry) return '';
  return entry[lang] || entry['en'] || '';
}

/* ─── App ─── */
function RequestApp() {
  const { lang, setLang } = useLang();

  // Determine initial tab from URL hash
  const [tab, setTab] = useState(() => {
    const h = window.location.hash.replace('#','');
    return (h === 'trial' || h === 'contact') ? h : (h === 'report-live' || h === 'report-portfolio') ? 'docs' : 'docs';
  });

  useEffect(() => {
    const onHash = () => {
      const h = window.location.hash.replace('#','');
      if (h === 'trial') setTab('trial');
      else if (h === 'contact') setTab('contact');
      else if (h === 'docs') setTab('docs');
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const switchTab = (t) => {
    setTab(t);
    window.history.replaceState(null, '', '#' + t);
  };

  return (
    <>
      {/* Nav */}
      <nav className="nav">
        <div className="nav-inner">
          <a href="index.html" className="brand">
            <img src="logo-arrow.png" alt="Previsio" className="nav-logo" />

                <button key={l} className={'lang-btn' + (lang === l ? ' active' : '')} onClick={() => setLang(l)}>
                  {LANG_LABELS[l]}
                </button>
              ))}
            </div>
          </div>
        </div>
      </nav>

      <div className="container">
        <div className="page-header">
          <a href="index.html" className="back-link">{c('back', lang)}</a>
          <h1 className="page-title">{c('pageTitle', lang)}</h1>
          <p className="page-sub">{c('pageSub', lang)}</p>

          <div className="form-tabs">
            <button className={'form-tab' + (tab === 'docs' ? ' active' : '')} onClick={() => switchTab('docs')}>
              {c('tabDocs', lang)}
            </button>
            <button className={'form-tab' + (tab === 'trial' ? ' active' : '')} onClick={() => switchTab('trial')}>
              {c('tabTrial', lang)}

            <button className={'form-tab' + (tab === 'contact' ? ' active' : '')} onClick={() => switchTab('contact')}>

/* ─── Documentation Form ─── */
function DocsForm({ lang }) {
  const [form, setForm] = useState({ name: '', email: '', company: '', message: '' });
  const [sent, setSent] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [fieldErrors, setFieldErrors] = useState({});

  const set = (k) => (e) => {
    setForm(prev => ({ ...prev, [k]: e.target.value }));
    setFieldErrors(prev => ({ ...prev, [k]: false }));
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    const errs = {};
    ['name','email','company'].forEach(k => { if (!form[k].trim()) errs[k] = true; });
    if (Object.keys(errs).length) { setFieldErrors(errs); return; }
    setFieldErrors({});
    setLoading(true);
    setError('');
    try {
      const res = await fetch('https://formspree.io/f/' + FORMSPREE_DOCS_ID, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          name: form.name,
          email: form.email,
          company: form.company,
          message: form.message || '(none)',
          request_type: 'Quantitative Methodology Document (DOCX)',
          _subject: '[Previsio] Documentation Request — ' + form.name,
        }),
      });
      const data = await res.json();
      if (res.ok) {
        setSent(true);
        notifyTelegram('PREVISIO — Documentation request\n\nName: ' + form.name + '\nEmail: ' + form.email + '\nCompany: ' + form.company + '\nMessage: ' + (form.message || '-') + '\n\nRequest: Quantitative Methodology Document (DOCX)');

      else { setError(data?.errors?.[0]?.message || 'Submission failed. Please try again.'); }
    } catch {
      setError('Network error. Please check your connection and try again.');
    } finally {
      setLoading(false);
    }
  };

  if (sent) {
    return (
      <div className="panel">
        <div className="success-state">
          <div className="success-icon">✓</div>
          <p className="success-msg">{c('docSent', lang)}</p>

            <div className="doc-spec-val">{c('docSpecFigures', lang)}</div>
          </div>

            <div className="doc-spec-label">{c('docSpecFormatLabel', lang)}</div>
            <div className="doc-spec-val">{c('docSpecFormat', lang)}</div>
          </div>

        </div>
        <div className="field">
          <label>{c('fieldCompany', lang)}</label>
          <input type="text" placeholder="Goldman Sachs · Mediobanca" value={form.company} onChange={set('company')} />
        </div>

        <div className="field">
          <label>{c('fieldContactMethod', lang)} *</label>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 4 }}>
            {Object.keys(methodMeta).map((m) => (
              <button
                type="button"
                key={m}
                onClick={() => setMethod(m)}
                className="form-tab"
                style={{
                  flex: '1 1 auto',
                  background: form.method === m ? 'rgba(212,175,55,0.12)' : 'rgba(255,255,255,0.03)',
                  color: form.method === m ? 'var(--gold-primary)' : 'var(--text-muted)',
                  border: form.method === m ? '1px solid rgba(212,175,55,0.25)' : '1px solid var(--border-subtle)',
                }}>
                {methodMeta[m].label}
              </button>
            ))}
          </div>
        </div>

        <div className="field">
          <label>{active.fieldLabel} *{fieldErrors.contact && <span className="field-error-inline"> — {c('fillThisField', lang)}</span>}</label>
          <input type={active.type} placeholder={active.placeholder} value={form.contact} onChange={set('contact')} />
        </div>

        <div className="field">
          <label>{c('fieldMessage', lang)}</label>
          <textarea rows="3" placeholder={c('fieldMessagePlaceholder', lang)} value={form.message} onChange={set('message')} style={{ resize: 'vertical', minHeight: 72 }}></textarea>
        </div>

        <button type="submit" className="btn btn-gold" disabled={loading} style={{ width: '100%', marginTop: 4 }}>
          {loading ? '···' : c('quoteSubmit', lang)}
          {!loading && <span className="arrow">→</span>}
        </button>

        <div className="form-footer">{c('quoteFooter', lang)}</div>
      </div>
    </form>
  );
}

/* ─── Mount ─── */
ReactDOM.createRoot(document.getElementById('root')).render(<RequestApp />);
</script>
</body>
</html>
